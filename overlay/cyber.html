<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Looking Cyber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
/* Layout: placar no topo; no combate, cartões nas laterais; na compra, um painel de economia
   com histórico de rodadas ocupa a parte de baixo. Painéis de vidro escuro com cortes chanfrados,
   borda em neon na cor do lado e textura de linhas de varredura. Palco fixo de 1920x1080. */
:root {
  --void: #050812;
  --glass: rgba(8, 13, 28, 0.86);
  --glass-hi: rgba(16, 24, 48, 0.9);
  --grid: rgba(140, 124, 255, 0.16);
  --violet: #8c7cff;
  --fg: #eaf4ff;
  --muted: #7f90ad;
  --atk: #ff3d6e;
  --def: #14e8c8;
  --spike: #ffc83d;
  --loss: #ff5a5a;
  --chrome-bg: #04060d;
  --chrome-raise: #0d1426;
  --display: "Chakra Petch", "Bahnschrift", "Arial Narrow", sans-serif;
  --ui: "Barlow Semi Condensed", "Bahnschrift", "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--chrome-bg); color: var(--fg); font-family: var(--ui); }
html:has(body.live), body.live { background: transparent; }
* { box-sizing: border-box; }
img { display: block; }
[hidden] { display: none !important; }

/* ---------- Página de prévia ---------- */
.page {
  max-width: 1240px; margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
.page h1 { font-family: var(--display); font-weight: 700; font-size: 2.4rem; line-height: 1.05; margin: 0; text-wrap: balance; }
.page .lede { margin: 6px 0 0; color: var(--muted); max-width: 64ch; line-height: 1.5; font-size: 1.05rem; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; border: 1px solid var(--grid); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls .group { display: flex; flex-wrap: wrap; gap: 6px; }
.controls .sep { width: 1px; height: 26px; background: var(--grid); margin-inline: 6px; }
.btn {
  font: 600 1rem var(--ui); color: var(--fg); background: var(--chrome-raise);
  border: 1px solid var(--grid); padding: 8px 14px; cursor: pointer;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}
.btn:hover { border-color: var(--violet); }
.btn:focus-visible { outline: 2px solid var(--spike); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--violet); color: var(--void); }
.note { color: var(--muted); line-height: 1.55; max-width: 76ch; margin: 0; }
.howto { display: grid; gap: 10px; max-width: 780px; line-height: 1.55; color: var(--muted); }
.howto h2 { font-family: var(--display); font-weight: 700; font-size: 1.4rem; color: var(--fg); margin: 10px 0 0; }
.howto p { margin: 0; }
.howto code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.86rem; color: var(--fg); }
.howto pre { margin: 0; padding: 12px 14px; background: var(--chrome-raise); border: 1px solid var(--grid); overflow-x: auto; }

/* Cena simulada atrás do overlay (só na prévia) */
.scene {
  position: absolute; inset: 0;
  background:
    radial-gradient(55% 45% at 70% 40%, rgba(140, 124, 255, 0.28), transparent 70%),
    radial-gradient(45% 50% at 22% 62%, rgba(255, 200, 61, 0.16), transparent 70%),
    linear-gradient(180deg, #1b2134 0%, #2c2a3e 46%, #3a3036 54%, #19161c 100%);
}
.scene::after {
  content: ""; position: absolute; inset: 54% 0 0 0;
  background:
    repeating-linear-gradient(90deg, rgba(140, 124, 255, 0.10) 0 2px, transparent 2px 120px),
    repeating-linear-gradient(0deg, rgba(140, 124, 255, 0.08) 0 2px, transparent 2px 60px);
  transform: perspective(500px) rotateX(58deg); transform-origin: top;
}

/* ---------- Palco ---------- */
.viewport { position: absolute; inset: 0; overflow: hidden; }
body.live .viewport { position: fixed; }
.stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform: scale(var(--s, 1)); transform-origin: 0 0;
  font-family: var(--ui); color: var(--fg); font-variant-numeric: tabular-nums;
}
.scan {
  background-image: repeating-linear-gradient(0deg, rgba(234, 244, 255, 0.035) 0 1px, transparent 1px 4px);
}
.chamfer { clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
.chamfer-r { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }

/* Faixa de informações no canto */
.info {
  position: absolute; top: 0; left: 0; height: 40px; display: flex; align-items: center; gap: 22px;
  padding: 0 26px 0 22px; background: var(--glass); font: 600 18px var(--ui); color: var(--fg);
  clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
}
.info .k { color: var(--muted); margin-right: 6px; font-weight: 500; }
.event-logo { position: absolute; top: 52px; left: 22px; height: 60px; max-width: 220px; object-fit: contain; }
.sponsor {
  position: absolute; top: 0; right: 0; width: 300px; height: 64px; display: grid; place-items: center;
  background: var(--glass); clip-path: polygon(18px 0, 100% 0, 100% 100%, 0 100%);
}
.sponsor img { max-width: 210px; max-height: 40px; object-fit: contain; transition: opacity 0.4s; }
.cv { width: 14px; height: 14px; object-fit: contain; }
.spike-icon img { width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(255, 200, 61, 0.8)); }
.mini { position: relative; overflow: hidden; }
.mini .art { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.28; }
.mini > :not(.art) { position: relative; }
/* Com a fonte Tungsten da pasta local: números e nomes grandes mais condensados e altos */
.stage.tungsten .bug .score { font: 400 84px/1 "Tungsten", var(--display); letter-spacing: 0.02em; }
.stage.tungsten .clock .time { font: 400 62px/1 "Tungsten", var(--display); letter-spacing: 0.04em; }
.stage.tungsten .plate .name { font: 400 56px/1 "Tungsten", var(--display); letter-spacing: 0.04em; }
.stage.tungsten .banner .big { font: 400 68px/1 "Tungsten", var(--display); letter-spacing: 0.04em; }
.stage.tungsten .tplate .tn { font: 400 46px/1 "Tungsten", var(--display); letter-spacing: 0.03em; }
.stage.tungsten .mini { font: 400 30px "Tungsten", var(--display); letter-spacing: 0.04em; }
.stage.tungsten .hpn { font: 400 30px/1 "Tungsten", var(--display); }

/* Placar */
.bug { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 330px 92px 210px 92px 330px; height: 92px; }
.plate { position: relative; display: flex; align-items: center; gap: 16px; padding: 0 28px; background: var(--glass); }
.plate.l { justify-content: flex-end; clip-path: polygon(0 0, 100% 0, 100% 100%, 34px 100%); }
.plate.r { justify-content: flex-start; clip-path: polygon(0 0, 100% 0, calc(100% - 34px) 100%, 0 100%); }
.plate::after { content: ""; position: absolute; bottom: 0; height: 3px; background: var(--side); box-shadow: 0 0 14px var(--side); }
.plate.l::after { left: 34px; right: 0; }
.plate.r::after { left: 0; right: 34px; }
.plate .name { font: 700 40px/1 var(--display); letter-spacing: 0.02em; }
.plate .logo { width: 54px; height: 54px; object-fit: contain; }
.plate .side { font: 600 16px var(--ui); color: var(--side); }
.bug .score { display: grid; place-items: center; font: 700 64px/1 var(--display); background: var(--glass-hi); color: var(--side); text-shadow: 0 0 18px var(--side); position: relative; }
.pips { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
.pips i { width: 18px; height: 5px; transform: skewX(-20deg); background: rgba(234, 244, 255, 0.18); }
.pips i.won { background: var(--side); box-shadow: 0 0 8px var(--side); }
.clock { position: relative; display: grid; place-items: center; align-content: center; gap: 3px; background: var(--void); border-bottom: 3px solid var(--violet); }
.clock .round { font: 600 16px var(--ui); color: var(--muted); }
.clock .time { font: 700 50px/1 var(--display); letter-spacing: 0.03em; }
.clock .bar { position: absolute; left: 0; bottom: -3px; height: 3px; width: 100%; background: var(--fg); transform-origin: left; transition: transform 0.25s linear; }
.clock.spike { background: #1a1204; border-bottom-color: #4a3608; }
.clock.spike .time { color: var(--spike); text-shadow: 0 0 18px rgba(255, 200, 61, 0.7); }
.clock.spike .round { color: var(--spike); }
.clock.spike .bar { background: var(--spike); box-shadow: 0 0 12px var(--spike); }
.spike-icon { position: absolute; left: 14px; top: 50%; width: 26px; height: 26px; margin-top: -13px; opacity: 0; }
.clock.spike .spike-icon { opacity: 1; animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.8); opacity: 0.5; } }

/* Faixa de fim de rodada: o único momento com efeito de glitch */
.banner { position: absolute; top: 116px; left: 50%; transform: translateX(-50%); min-width: 700px; text-align: center; padding: 16px 48px 14px; background: var(--glass); opacity: 0; transition: opacity 0.2s; }
.banner::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--side); box-shadow: 0 0 16px var(--side); }
.banner.on { opacity: 1; }
.banner.on .big { animation: glitch 0.55s steps(2, end) 1; }
.banner .big { font: 700 52px/1 var(--display); letter-spacing: 0.02em; }
.banner .small { margin-top: 8px; font: 600 20px var(--ui); color: var(--side); }
@keyframes glitch {
  0% { text-shadow: 6px 0 var(--atk), -6px 0 var(--def); transform: translateX(-4px); clip-path: inset(10% 0 55% 0); }
  25% { text-shadow: -5px 0 var(--atk), 5px 0 var(--def); transform: translateX(4px); clip-path: inset(55% 0 8% 0); }
  50% { text-shadow: 3px 0 var(--atk), -3px 0 var(--def); transform: translateX(-2px); clip-path: inset(0 0 0 0); }
  100% { text-shadow: none; transform: none; clip-path: inset(0 0 0 0); }
}

/* ---------- Combate: cartões laterais ---------- */
.side-cards { position: absolute; bottom: 22px; width: 340px; display: grid; gap: 8px; transition: opacity 0.3s, transform 0.3s; }
.side-cards.l { left: 18px; }
.side-cards.r { right: 18px; }
.stage.buy .side-cards { opacity: 0; transform: translateY(24px); pointer-events: none; }
.pc { position: relative; height: 96px; display: grid; grid-template-columns: 84px 1fr; background: var(--glass); }
.side-cards.r .pc { grid-template-columns: 1fr 84px; }
.side-cards.r .pc .face { order: 2; }
.pc::after { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--side); box-shadow: 0 0 10px var(--side); }
.side-cards.l .pc::after { left: 0; }
.side-cards.r .pc::after { right: 0; }
.pc.observed { background: var(--glass-hi); box-shadow: inset 0 0 0 2px var(--side); }
.pc.dead .face img, .pc.dead .face .ph { filter: grayscale(1) brightness(0.45); }
.pc.dead .pbody { opacity: 0.45; }
.face { position: relative; overflow: hidden; background: linear-gradient(160deg, color-mix(in srgb, var(--side) 38%, transparent), transparent 70%); }
.face img { width: 84px; height: 96px; object-fit: cover; object-position: center 20%; }
.ph { width: 84px; height: 96px; display: grid; place-items: center; align-content: center; gap: 4px; font: 700 14px var(--display); color: var(--fg); }
.ph svg { width: 30px; height: 30px; color: var(--side); }
.pbody { display: grid; grid-template-rows: auto auto auto; align-content: center; gap: 6px; padding: 0 12px; min-width: 0; }
.prow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.side-cards.r .prow { flex-direction: row-reverse; }
.pname { font: 700 22px/1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.side-cards.r .pname { text-align: right; }
.kda { font: 600 17px var(--display); color: var(--fg); white-space: nowrap; }
.shield-b { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 22px; padding: 0 4px; font: 700 14px var(--display); color: var(--void); background: var(--fg); clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); }
.shield-b.none { visibility: hidden; }
.hpn { font: 700 22px/1 var(--display); min-width: 42px; }
.side-cards.r .hpn { text-align: right; }
.hpbar { flex: 1; height: 6px; background: rgba(234, 244, 255, 0.12); position: relative; overflow: hidden; }
.hpbar i { position: absolute; top: 0; bottom: 0; width: 100%; background: var(--side); box-shadow: 0 0 8px var(--side); transform-origin: left; transition: transform 0.25s; }
.side-cards.r .hpbar i { transform-origin: right; }
.hpbar.low i { background: var(--loss); box-shadow: 0 0 8px var(--loss); }
.kit { justify-content: space-between; }
.abils { display: flex; gap: 6px; align-items: flex-end; }
.ab { display: grid; justify-items: center; gap: 2px; width: 26px; }
.ab .ic { width: 22px; height: 22px; object-fit: contain; filter: brightness(0) invert(1); opacity: 0.85; }
.ab .lt { width: 22px; height: 22px; display: grid; place-items: center; font: 700 13px var(--display); color: var(--muted); border: 1px solid rgba(234, 244, 255, 0.2); }
.ab.empty .ic, .ab.empty .lt { opacity: 0.28; }
.dots { display: flex; gap: 2px; height: 4px; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--fg); }
.ult { position: relative; width: 30px; height: 30px; flex: none; }
.ult svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ult .track { stroke: rgba(234, 244, 255, 0.16); }
.ult .fill { stroke: var(--fg); transition: stroke-dashoffset 0.3s; }
.ult.ready .fill { stroke: var(--spike); filter: drop-shadow(0 0 4px var(--spike)); }
.ult .uic { position: absolute; inset: 7px; width: 16px; height: 16px; object-fit: contain; filter: brightness(0) invert(1); }
.ult.ready .uic { filter: brightness(0) invert(1) drop-shadow(0 0 3px var(--spike)); }
.weap { height: 24px; max-width: 96px; object-fit: contain; filter: brightness(0) invert(1); }
.pc .weap { max-width: 88px; }
.side-cards.r .weap { transform: scaleX(-1); }
.wtxt { font: 600 15px var(--ui); color: var(--muted); white-space: nowrap; }

/* ---------- Compra: painel de economia ---------- */
.econ { position: absolute; left: 40px; right: 40px; bottom: 22px; display: grid; gap: 8px; opacity: 0; transform: translateY(30px); transition: opacity 0.35s, transform 0.35s; pointer-events: none; }
.stage.buy .econ { opacity: 1; transform: none; }
.econ-head { display: grid; grid-template-columns: 380px 1fr 380px; height: 92px; gap: 8px; }
.tplate { position: relative; display: flex; align-items: center; gap: 18px; padding: 0 26px; background: var(--glass); overflow: hidden; }
.tplate.r { flex-direction: row-reverse; text-align: right; }
.tplate::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--side) 34%, transparent), transparent 75%); }
.tplate.r::before { background: linear-gradient(270deg, color-mix(in srgb, var(--side) 34%, transparent), transparent 75%); }
.tplate > * { position: relative; }
.tplate .logo { width: 62px; height: 62px; object-fit: contain; }
.tplate > div { min-width: 0; }
.tplate .tn { font: 700 38px/1.05 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tplate .val { font: 600 18px var(--ui); color: var(--muted); margin-top: 4px; }
.tplate .val b { color: var(--fg); font-weight: 700; }
.mid { display: grid; grid-template-columns: 190px 1fr; gap: 8px; }
.mini { display: grid; align-content: center; gap: 4px; padding: 0 16px; background: var(--glass); font: 700 22px var(--display); }
.mini .row { display: flex; justify-content: space-between; align-items: center; }
.mini .row span:last-child { color: var(--side); }
.mini .to { display: flex; justify-content: space-between; align-items: center; font: 600 14px var(--ui); color: var(--muted); }
.mini .to b { display: inline-flex; gap: 3px; }
.mini .to b i { width: 14px; height: 4px; background: rgba(234, 244, 255, 0.18); }
.mini .to b i.on { background: var(--fg); }
.hist { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; gap: 3px; padding: 8px; background: var(--glass); }
.hc { display: grid; place-items: center; font: 600 15px var(--display); color: rgba(234, 244, 255, 0.35); background: rgba(234, 244, 255, 0.04); }
.hc.win { background: color-mix(in srgb, var(--side) 30%, transparent); color: var(--fg); box-shadow: inset 0 -2px 0 var(--side); }
.hc.win svg { width: 18px; height: 18px; color: var(--fg); }
.hc.now { outline: 1px solid var(--violet); color: var(--fg); }
.hc.half { margin-left: 8px; }
.econ-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.erows { display: grid; gap: 4px; }
.er { display: grid; grid-template-columns: 76px 92px 100px 32px 36px 120px 46px minmax(0, 1fr) 86px; align-items: center; gap: 10px; height: 52px; padding: 0 14px; background: var(--glass); position: relative; }
.erows.r .er { direction: rtl; }
.erows.r .er > * { direction: ltr; }
.er::after { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--side); }
.erows.l .er::after { left: 0; }
.erows.r .er::after { right: 0; }
.er .spent { font: 600 18px var(--display); color: var(--loss); text-align: right; }
.er .cr { font: 700 20px var(--display); display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
.erows.r .er .spent { text-align: left; }
.erows.r .er .cr { justify-content: flex-start; }
.cr svg { width: 13px; height: 13px; color: var(--spike); }
.er .abils { justify-content: center; }
.er .weap-cell { display: flex; justify-content: center; }
.er .face-s { width: 46px; height: 46px; overflow: hidden; background: linear-gradient(160deg, color-mix(in srgb, var(--side) 45%, transparent), transparent 75%); }
.er .face-s img { width: 46px; height: 46px; object-fit: cover; }
.er .face-s .ph { width: 46px; height: 46px; }
.er .face-s .ph svg { width: 22px; height: 22px; }
.er .face-s .ph span { display: none; }
.er .nm { font: 700 21px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.er .kd { font: 600 19px var(--display); text-align: right; }
.erows.r .er .kd { text-align: left; }
.erows.r .er .nm { text-align: right; }
.erows.r .er .weap { transform: scaleX(-1); }
.shield-s { display: flex; justify-content: center; }

.status-pill { position: absolute; left: 24px; top: 54px; padding: 8px 14px; background: var(--glass); font: 600 17px var(--ui); color: var(--spike); border-left: 3px solid var(--spike); }

@media (prefers-reduced-motion: reduce) {
  .clock.spike .spike-icon, .banner.on .big { animation: none; }
  .side-cards, .econ, .hpbar i, .clock .bar, .ult .fill { transition: none; }
}
@media (max-width: 640px) { .page h1 { font-size: 1.9rem; } .controls .sep { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  "use strict";
  const params = new URLSearchParams(location.search);
  const groupCode = (params.get("groupCode") || "").toUpperCase();
  const MODE = groupCode ? "live" : params.has("demo") ? "demo" : "preview";
  const SERVER = params.get("server") || "http://localhost:5200";
  const DEBUG = params.has("debug");
  const USE_IMAGES = params.get("images") !== "0";
  const root = document.documentElement;
  const hex = (k) => (/^[0-9a-f]{6}$/i.test(params.get(k) || "") ? "#" + params.get(k) : null);
  if (hex("attack")) root.style.setProperty("--atk", hex("attack"));
  if (hex("defense")) root.style.setProperty("--def", hex("defense"));

  // ---------- Referências do jogo ----------
  const AGENTS = {
    AggroBot: "Gekko", BountyHunter: "Fade", Breach: "Breach", Cable: "Deadlock", Cashew: "Tejo",
    Clay: "Raze", Deadeye: "Chamber", Grenadier: "KAY/O", Guide: "Skye", Gumshoe: "Cypher",
    Hunter: "Sova", Iris: "Miks", Killjoy: "Killjoy", Mage: "Harbor", Nox: "Vyse", Pandemic: "Viper",
    Pine: "Veto", Phoenix: "Phoenix", Rift: "Astra", Sarge: "Brimstone", Sequoia: "Iso", Smonk: "Clove",
    Sprinter: "Neon", Stealth: "Yoru", Terra: "Waylay", Thorne: "Sage", Vampire: "Reyna", Wraith: "Omen",
    Wushu: "Jett",
  };
  const ROLES = {
    duelist: ["Jett", "Raze", "Phoenix", "Reyna", "Yoru", "Neon", "Iso", "Waylay"],
    initiator: ["Sova", "Breach", "Skye", "KAY/O", "Fade", "Gekko", "Tejo"],
    controller: ["Brimstone", "Viper", "Omen", "Astra", "Harbor", "Clove"],
    sentinel: ["Sage", "Cypher", "Killjoy", "Chamber", "Deadlock", "Vyse", "Veto"],
  };
  const agentName = (internal) => AGENTS[internal] || Object.entries(AGENTS).find(([k]) => k.toLowerCase() === String(internal || "").toLowerCase())?.[1] || internal || "";
  const roleOf = (n) => Object.keys(ROLES).find((r) => ROLES[r].includes(n)) || "other";
  const GLYPH = {
    duelist: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20 12 3l9 17-9-5z"/></svg>',

  const $ = (id) => document.getElementById(id);

  const setText = (n, t) => { if (n.textContent !== t) n.textContent = t; };

    });
  }

  function renderRows(list, team, imgKey) {
    const ps = (team.players || []).slice(0, 5);
    list.forEach((k, i) => {
      const p = ps[i];
      k.el.hidden = !p; if (!p) return;
      setText(k.spent, p.moneySpent > 0 ? "-" + money(p.moneySpent) : "");
      setHTML(k.cr, (LOCAL.base ? `<img class="cv" src="${LOCAL.base}Escudos/CV.png" alt="">` : CREDIT) + `<span>${money(p.money)}</span>`, imgKey + p.money);
      const ab = p.abilities || {};
      setHTML(k.ab, abilsHTML(p.agentInternal, ab), imgKey + [p.agentInternal, ab.grenade, ab.ability1, ab.ability2].join());
      k.ult.classList.toggle("ready", !!p.ultReady);
      setHTML(k.ult, ultHTML(p.agentInternal, p.currUltPoints || 0, p.maxUltPoints || 0, p.ultReady), imgKey + [p.agentInternal, p.currUltPoints, p.maxUltPoints, p.ultReady].join());
      const armor = ARMOR[p.armorName];
      const shSrc = shieldAsset(p.armorName);
      setHTML(k.sh, armor ? (shSrc ? `<img class="weap" style="height:26px" src="${shSrc}" alt="${armor}">` : `<span class="shield-b">${armor}</span>`) : "", imgKey + p.armorName);
      setHTML(k.wp, weaponHTML(p.highestWeapon), imgKey + p.highestWeapon);
      setHTML(k.face, faceHTML(p.agentInternal), imgKey + p.agentInternal);
      setText(k.name, p.name || p.fullName || "");
      setText(k.kd, `${p.kills ?? 0}/${p.deaths ?? 0}/${p.assists ?? 0}`);
    });
  }

  // Histórico: uma coluna por rodada; a célula do vencedor acende com o motivo
  function renderHistory(d, L, R, sideVar) {
    const total = Math.max(24, d.roundNumber || 1);
    const start = Math.max(1, total - 23);
    const recL = {}, recR = {};
    (L.roundRecord || []).forEach((r) => (recL[r.round] = r));
    (R.roundRecord || []).forEach((r) => (recR[r.round] = r));
    const key = [start, d.roundNumber, (L.roundRecord || []).length, (R.roundRecord || []).length, L.isAttacking].join();
    const hist = $("hist");
    if (hist._k === key) return;
    hist._k = key;
    hist.style.setProperty("--l", sideVar(L));
    let html = "";
    for (let n = start; n < start + 24; n++) {
      const cell = (rec, team) => {
        const win = rec && REASON_ICON[rec.type];
        const half = n === (d.switchRound || 13) ? " half" : "";
        const now = n === d.roundNumber && !win ? " now" : "";
        const side = rec ? (rec.wasAttack ? "var(--atk)" : "var(--def)") : "transparent";
        return win
          ? `<div class="hc win${half}" style="--side:${side}">${REASON_ICON[rec.type]}</div>`
          : `<div class="hc${half}${now}">${String(n).padStart(2, "0")}</div>`;
      };
      html += cell(recL[n], L) + cell(recR[n], R);
    }
    hist.innerHTML = html;
  }

  // ---------- Partida real ----------
  // Logos que não existirem somem em vez de mostrar imagem quebrada
  stage.addEventListener("error", (e) => { if (e.target.tagName === "IMG" && e.target.classList.contains("logo")) e.target.hidden = true; }, true);
  function startSponsors() {
    if (!LOCAL.sponsors.length) return;
    const box = $("sponsor"), img = $("sponsor-img");
    let n = 0;
    box.hidden = false; img.src = LOCAL.sponsors[0];
    if (LOCAL.sponsors.length > 1) setInterval(() => {
      n = (n + 1) % LOCAL.sponsors.length;
      img.style.opacity = "0";
      setTimeout(() => { img.src = LOCAL.sponsors[n]; img.style.opacity = "1"; }, 400);
    }, 6000);
  }
  loadLocal().then(() => {
    if (LOCAL.base) document.querySelector(".spike-icon").innerHTML = `<img src="${LOCAL.base}spike.png" alt="">`;
  });
  loadAssets();
  if (MODE === "live") {
    const status = $("status");
    const show = (m) => { if (DEBUG) { status.hidden = !m; status.textContent = m || ""; } };
    if (typeof io === "undefined") { show("Não consegui carregar o socket.io. Verifique a internet do PC do OBS."); return; }
    let data = null;
    const socket = io(SERVER, { reconnection: true });
    const logon = () => socket.emit("logon", JSON.stringify({ groupCode }));
    show("Conectando a " + SERVER + "…");
    socket.on("connect", logon);
    socket.on("logon_success", () => show(""));
    socket.on("connect_error", () => show("Sem conexão com " + SERVER));
    socket.on("match_data", (raw) => { try { data = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { /* pacote inválido */ } });
    setInterval(() => { if (data) render(data, performance.now() / 1000); }, 100);
    return;
  }

  // ---------- Partida simulada ----------
  const ROSTERS = [
    { teamName: "Jangada Esports", teamTricode: "JGD", players: [["kaiaque", "Jett"], ["mareh", "Omen"], ["Tucunaré", "Sova"], ["vento sul", "Killjoy"], ["cajuzin", "Breach"]] },
    { teamName: "Caatinga Club", teamTricode: "CTG", players: [["xique", "Raze"], ["mandacaru", "Viper"], ["lampião", "Fade"], ["seriema", "Cypher"], ["aboio", "Astra"]] },
  ];
  const internalOf = (n) => Object.keys(AGENTS).find((k) => AGENTS[k] === n) || n;
  const ULT = { Jett: 8, Omen: 7, Sova: 8, Killjoy: 9, Breach: 8, Raze: 8, Viper: 9, Fade: 8, Cypher: 6, Astra: 7 };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  function newMatch() {
    return {
      groupCode: "DEMO", roundNumber: 1, roundPhase: "shopping", map: "Ascent", attackersWon: false, switchRound: 13, firstOtRound: 25,
      spikeState: { planted: false, defused: false, detonated: false },
      timeoutState: { techPause: false, leftTeam: false, rightTeam: false, timeRemaining: 0 },
      tools: { seriesInfo: { needed: 2, wonLeft: 1, wonRight: 0, mapInfo: [] }, tournamentInfo: { name: "Copa Litoral", logoUrl: "", backdropUrl: "" }, timeoutCounter: { max: 2, left: 2, right: 1 } },
      teams: ROSTERS.map((t, ti) => ({
        teamName: t.teamName, teamTricode: t.teamTricode, teamUrl: "", spentThisRound: 0, isAttacking: ti === 0, roundsWon: 0, roundRecord: [],
        players: t.players.map(([name, agent], pi) => ({
          name, fullName: name, playerId: ti * 5 + pi, isAlive: true, agentInternal: internalOf(agent), armorName: "None", money: 800, moneySpent: 0,
          highestWeapon: "Classic", currUltPoints: 0, maxUltPoints: ULT[agent] || 7, ultReady: false, hasSpike: false,
          auxiliaryAvailable: { health: true, abilities: true, scoreboard: true },
          kills: 0, deaths: 0, assists: 0, killsThisRound: 0, deathsThisRound: 0, killedPlayerNames: [], health: 100, isObserved: false,
          abilities: { grenade: 1, ability1: 2, ability2: 1 },
        })),
      })),
    };
  }
  const sim = { d: newMatch(), t: 0, speed: 3, paused: false, at: 0, nextEvent: 0, plantAt: 0, nextObs: 0, plan: [] };

  function startShopping() {
    const d = sim.d;
    d.roundPhase = "shopping"; sim.at = sim.t; sim.plan = [];
    d.spikeState = { planted: false, defused: false, detonated: false };
    d.teams.forEach((t) => {
      t.spentThisRound = 0;
      t.players.forEach((p) => {
        p.isAlive = true; p.health = 100; p.killsThisRound = 0; p.deathsThisRound = 0; p.moneySpent = 0; p.isObserved = false;
        p.abilities = { grenade: 1, ability1: 2, ability2: 1 };
        if (d.roundNumber === 1 || d.roundNumber === d.switchRound) { p.money = 800; p.highestWeapon = "Classic"; p.armorName = "None"; }
        let weapon = p.highestWeapon, armor = p.armorName;
        const keep = p.highestWeapon !== "Classic";
        if (!keep || p.money >= 3900) {
          if (p.money >= 5700 && Math.random() < 0.15) { weapon = "Operator"; armor = "Heavy"; }
          else if (p.money >= 3900) { weapon = pick(["Vandal", "Phantom"]); armor = "Heavy"; }
          else if (p.money >= 2400) { weapon = pick(["Spectre", "Bulldog", "Marshal"]); armor = "Light"; }
          else if (p.money >= 1300) { weapon = pick(["Sheriff", "Ghost", "Stinger"]); armor = "Light"; }
        }
        if (armor === "None" && p.money >= 400) armor = "Light";
        let cost = (weapon !== p.highestWeapon ? COST[weapon] || 0 : 0) + (armor !== p.armorName ? COST[armor] || 0 : 0) + 200;
        cost = Math.min(cost, p.money);
        sim.plan.push({ p, t, cost, weapon, armor, at: rnd(2, 16) });
      });
    });
  }
  const buy = (b) => { if (b.done) return; b.done = true; b.p.money -= b.cost; b.p.moneySpent += b.cost; b.t.spentThisRound += b.cost; b.p.highestWeapon = b.weapon; b.p.armorName = b.armor; };
  function startCombat() {
    sim.plan.forEach(buy); sim.plan = [];
    sim.d.roundPhase = "combat"; sim.at = sim.t; sim.nextEvent = sim.t + rnd(8, 16); sim.plantAt = sim.t + rnd(38, 72); sim.nextObs = sim.t;
  }
  function endRound(attWon, reason) {
    const d = sim.d;
    if (d.roundPhase === "end") return;
    d.roundPhase = "end"; sim.at = sim.t; d.attackersWon = attWon;
    d.teams.forEach((t) => {
      const won = t.isAttacking === attWon;
      if (won) t.roundsWon++;
      t.roundRecord.push({ type: won ? reason : "lost", wasAttack: t.isAttacking, round: d.roundNumber });
      t.players.forEach((p) => {
        p.money = Math.min(9000, p.money + (won ? 3000 : 1900) + p.killsThisRound * 200);
        if (!p.isAlive) { p.highestWeapon = "Classic"; p.armorName = "None"; }
        p.isObserved = false;
      });
    });
  }
  function nextRound() {
    const d = sim.d;
    if (d.teams.some((t) => t.roundsWon >= 13)) { sim.d = newMatch(); startShopping(); return; }
    d.roundNumber++;
    if (d.roundNumber === d.switchRound) d.teams.forEach((t) => (t.isAttacking = !t.isAttacking));
    startShopping();
  }
  function plant() {
    const d = sim.d, att = d.teams.find((t) => t.isAttacking);
    if (d.roundPhase !== "combat" || d.spikeState.planted || !att.players.some((p) => p.isAlive)) return;
    d.spikeState.planted = true; sim.plantAt = sim.t;
  }
  function fight() {
    const [A, B] = sim.d.teams;
    const alive = (t) => t.players.filter((p) => p.isAlive);
    if (!alive(A).length || !alive(B).length) return;
    const st = Math.random() < 0.5 ? A : B, tt = st === A ? B : A;
    const s = pick(alive(st)), v = pick(alive(tt));
    if (Math.random() < 0.4) { const k = pick(["grenade", "ability1", "ability2"]); s.abilities[k] = Math.max(0, s.abilities[k] - 1); }
    v.health = Math.max(0, v.health - (Math.random() < 0.55 ? 999 : Math.round(rnd(20, 80))));
    if (v.health === 0) {
      v.isAlive = false; v.deaths++; v.deathsThisRound++;
      s.kills++; s.killsThisRound++;
      const helper = alive(st).find((p) => p !== s);
      if (helper && Math.random() < 0.4) helper.assists++;
      s.currUltPoints = Math.min(s.maxUltPoints, s.currUltPoints + 1); s.ultReady = s.currUltPoints >= s.maxUltPoints;
      if (v.isObserved) { v.isObserved = false; sim.nextObs = sim.t; }
    }
  }
  function step(dt) {
    const d = sim.d;
    sim.t += dt;
    const el = sim.t - sim.at;
    if (d.roundPhase === "shopping") {
      sim.plan.forEach((b) => { if (el >= b.at) buy(b); });
      if (el >= DURATION.shopping) startCombat();
    } else if (d.roundPhase === "combat") {
      const att = d.teams.find((t) => t.isAttacking), def = d.teams.find((t) => !t.isAttacking);
      const aA = att.players.some((p) => p.isAlive), dA = def.players.some((p) => p.isAlive);
      if (sim.t >= sim.nextObs) {
        const c = d.teams.flatMap((t) => t.players.filter((p) => p.isAlive));
        d.teams.forEach((t) => t.players.forEach((p) => (p.isObserved = false)));
        if (c.length) pick(c).isObserved = true;
        sim.nextObs = sim.t + rnd(6, 11);
      }
      if (sim.t >= sim.nextEvent) { fight(); sim.nextEvent = sim.t + rnd(3, 9); }
      if (!d.spikeState.planted && sim.t >= sim.plantAt && aA) plant();
      if (d.spikeState.planted) {
        if (sim.t - sim.plantAt >= DURATION.spike) { d.spikeState.detonated = true; endRound(true, "detonated"); }
        else if (!aA && dA && sim.t - sim.plantAt > 8) { d.spikeState.defused = true; endRound(false, "defused"); }
        else if (!dA) endRound(true, "kills");
      } else if (!aA) endRound(false, "kills");
      else if (!dA) endRound(true, "kills");
      else if (el >= DURATION.combat) endRound(false, "timeout");
    } else if (d.roundPhase === "end" && el >= 7) nextRound();
  }

  // Começa no meio de uma partida para a prévia já mostrar histórico e economia
  function warmup() {
    startShopping();
    sim.speed = 1;
    for (let i = 0; i < 9 * 200 && sim.d.roundNumber < 10; i++) step(0.5);
    sim.speed = 3;
  }
  warmup();

  let last = performance.now();
  function frame(ts) {
    const dt = Math.min(0.25, (ts - last) / 1000); last = ts;
    if (!sim.paused) step(dt * sim.speed);
    render(sim.d, sim.t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (MODE === "preview") {
    const note = $("img-note");
    const updNote = () => setText(note, LOCAL.base
      ? "Imagens carregadas da pasta de recursos do seu PC (" + LOCAL.base + ")."
      : ASSETS.ready
      ? "Imagens oficiais do jogo carregadas da internet."
      : "Esta prévia mostra ícones próprios no lugar das imagens do jogo, porque a página publicada não pode carregar imagens de outros sites. Aberto no navegador ou no OBS, o arquivo puxa os retratos, habilidades, armas e escudos oficiais.");
    updNote(); setTimeout(updNote, 4000);
    const pb = $("btn-play"), sb = $("btn-speed");
    pb.addEventListener("click", () => { sim.paused = !sim.paused; pb.textContent = sim.paused ? "Continuar" : "Pausar"; pb.setAttribute("aria-pressed", String(sim.paused)); });
    sb.addEventListener("click", () => { sim.speed = sim.speed === 3 ? 1 : 3; sb.textContent = sim.speed === 3 ? "Velocidade 3×" : "Velocidade 1×"; sb.setAttribute("aria-pressed", String(sim.speed === 1)); });
    document.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
      const j = b.dataset.jump, d = sim.d;
      if (j === "shopping") { if (d.roundPhase !== "shopping") nextRound(); }
      else if (j === "combat") { if (d.roundPhase === "end") nextRound(); if (d.roundPhase === "shopping") startCombat(); }
      else if (j === "plant") { if (d.roundPhase === "end") nextRound(); if (d.roundPhase === "shopping") startCombat(); plant(); }
      else if (j === "end") {
        if (d.roundPhase === "shopping") startCombat();
        if (d.roundPhase !== "combat") return;
        const attWins = d.spikeState.planted ? true : Math.random() < 0.5;
        d.teams.filter((t) => t.isAttacking !== attWins).forEach((t) => t.players.forEach((p) => { p.isAlive = false; p.health = 0; }));
        endRound(attWins, "kills");
      }
    }));
  }
})();
</script>
</body>
