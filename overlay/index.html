<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Looking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Manrope:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
/* Layout: placar central no topo com fita de tempo que drena das pontas para o centro;
   cinco cartões por time nas laterais inferiores; tudo desenhado em 1920x1080 e escalado. */
:root {
  --ink: #0d111c;
  --panel: rgba(13, 17, 28, 0.88);
  --panel-soft: rgba(13, 17, 28, 0.62);
  --line: rgba(226, 232, 244, 0.12);
  --fg: #eef1f7;
  --muted: #8b93a7;
  --atk: #ff5a6a;
  --def: #3ee6b5;
  --spike: #ffb547;
  --chrome-bg: #070a12;
  --chrome-raise: #111726;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --ui: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--chrome-bg); color: var(--fg); font-family: var(--ui); }
body.live { background: transparent; }
html:has(body.live) { background: transparent; }
* { box-sizing: border-box; }

/* ---------- Página de prévia ---------- */
.page {
  max-width: 1240px; margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
.page h1 { font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.page .lede { margin: 6px 0 0; color: var(--muted); max-width: 62ch; line-height: 1.5; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.controls .sep { width: 1px; height: 26px; background: var(--line); margin-inline: 6px; }
.btn {
  font: 600 0.9rem var(--ui); color: var(--fg); background: var(--chrome-raise);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer;
}
.btn:hover { border-color: rgba(226, 232, 244, 0.3); }
.btn:focus-visible { outline: 2px solid var(--spike); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.howto { display: grid; gap: 10px; max-width: 760px; line-height: 1.55; color: var(--muted); }
.howto h2 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--fg); margin: 12px 0 0; }
.howto p { margin: 0; }
.howto code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.86rem; color: var(--fg); }
.howto pre { margin: 0; padding: 12px 14px; background: var(--chrome-raise); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }

/* Fundo simulado (só na prévia): sugere um mapa sem usar imagem do jogo */
.scene {
  position: absolute; inset: 0;
  background:
    radial-gradient(60% 50% at 30% 70%, rgba(255, 181, 71, 0.18), transparent 70%),
    radial-gradient(50% 60% at 75% 35%, rgba(62, 230, 181, 0.10), transparent 70%),
    linear-gradient(180deg, #2b3242 0%, #3a3a3f 48%, #4a3f36 52%, #2a2622 100%);
}
.scene::after {
  content: ""; position: absolute; inset: 52% 0 0 0;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 120px),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.04) 0 2px, transparent 2px 60px);
  transform: perspective(500px) rotateX(58deg); transform-origin: top;
}

/* ---------- Palco 1920x1080 ---------- */
.viewport { position: absolute; inset: 0; overflow: hidden; }
body.live .viewport { position: fixed; }
.stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform: scale(var(--s, 1)); transform-origin: 0 0;
  font-family: var(--ui); color: var(--fg);
  font-variant-numeric: tabular-nums;
}

/* Placar */
.scorebug { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 860px; }
.bug-row { display: grid; grid-template-columns: 1fr 96px 200px 96px 1fr; height: 82px; }
.team-plate { display: flex; align-items: center; gap: 14px; padding: 0 22px; background: var(--panel); position: relative; }
.team-plate.left { justify-content: flex-end; clip-path: polygon(22px 0, 100% 0, 100% 100%, 0 100%); }
.team-plate.right { justify-content: flex-start; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%); }
.team-plate .tri { font: 800 44px/1 var(--display); letter-spacing: 0.02em; }
.team-plate .side-tag { font: 600 15px var(--ui); color: var(--muted); }
.team-plate .logo { width: 46px; height: 46px; object-fit: contain; }
.pips { display: flex; gap: 5px; position: absolute; bottom: 10px; }
.team-plate.left .pips { right: 22px; }
.team-plate.right .pips { left: 22px; }
.pip { width: 16px; height: 4px; background: rgba(226, 232, 244, 0.2); }
.pip.won { background: var(--fg); }
.score {
  display: grid; place-items: center; font: 800 66px/1 var(--display);
  color: var(--ink); background: var(--team, var(--fg));
  transition: background-color 0.4s;
}
.clock {
  display: grid; place-items: center; align-content: center; gap: 2px;
  background: var(--ink); position: relative;
}
.clock .time { font: 700 50px/1 var(--display); letter-spacing: 0.02em; }
.clock .phase { font: 600 14px var(--ui); color: var(--muted); }
.clock.spike { background: #1d1407; }
.clock.spike .time { color: var(--spike); }
.clock.spike .phase { color: var(--spike); }
.spike-mark { position: absolute; left: 12px; top: 10px; width: 18px; height: 18px; opacity: 0; }
.clock.spike .spike-mark { opacity: 1; animation: beat 1s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.82); opacity: 0.55; } }

/* A fita: o tempo restante drena das duas pontas para o centro */
.ribbon { position: relative; height: 6px; background: rgba(13, 17, 28, 0.7); }
.ribbon span { position: absolute; top: 0; bottom: 0; width: 50%; transition: transform 0.25s linear, background-color 0.4s; }
.ribbon .l { right: 50%; transform-origin: right center; background: var(--rib-l, var(--fg)); }
.ribbon .r { left: 50%; transform-origin: left center; background: var(--rib-r, var(--fg)); }
.sub-strip { display: flex; justify-content: space-between; padding: 8px 4px 0; font: 600 15px var(--ui); color: var(--fg); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }
.sub-strip .muted { color: rgba(238, 241, 247, 0.72); }

/* Faixa de fim de rodada / pausa */
.banner {
  position: absolute; top: 150px; left: 50%; transform: translate(-50%, -8px);
  min-width: 620px; padding: 16px 40px 14px; text-align: center;
  background: var(--panel); border-top: 4px solid var(--team, var(--fg));
  opacity: 0; transition: opacity 0.35s, transform 0.35s;
}
.banner.on { opacity: 1; transform: translate(-50%, 0); }
.banner .big { font: 800 52px/1 var(--display); letter-spacing: 0.01em; }
.banner .small { margin-top: 6px; font: 600 17px var(--ui); color: var(--muted); }

/* Cartões de jogadores */
.roster { position: absolute; bottom: 36px; width: 452px; display: grid; gap: 8px; }
.roster.left { left: 28px; }
.roster.right { right: 28px; }
.roster-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 14px; background: var(--panel-soft); font: 600 15px var(--ui); color: var(--muted);
  opacity: 0; transition: opacity 0.3s;
}
.roster-head b { font: 700 22px var(--display); color: var(--fg); }
.roster.buy .roster-head { opacity: 1; }
.card {
  --team: var(--fg);
  position: relative; height: 66px; display: grid;
  grid-template-columns: 66px 1fr auto; align-items: stretch;
  background: var(--panel); transition: opacity 0.4s, filter 0.4s;
}
.roster.right .card { grid-template-columns: auto 1fr 66px; }
.roster.right .card .agent { order: 3; }
.roster.right .card .body { order: 2; text-align: right; }
.roster.right .card .gear { order: 1; align-items: flex-start; }
.card::before { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; background: var(--team); }
.roster.left .card::before { left: 0; }
.roster.right .card::before { right: 0; }
.card.observed { box-shadow: inset 0 0 0 2px rgba(238, 241, 247, 0.85); }
.card.dead { opacity: 0.42; filter: saturate(0.2); }
.agent { display: grid; place-items: center; align-content: center; gap: 2px; background: rgba(255, 255, 255, 0.04); }
.agent svg { width: 26px; height: 26px; color: var(--team); }
.agent .aname { font: 700 12px var(--ui); color: var(--muted); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.body { display: grid; align-content: center; gap: 7px; padding: 0 14px; min-width: 0; }
.line1 { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.roster.right .line1 { flex-direction: row-reverse; }
.pname { font: 700 25px/1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-shrink: 1; }
.weapon { font: 600 15px var(--ui); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-shrink: 4; }
.kr { font: 700 14px var(--ui); color: var(--spike); white-space: nowrap; }
.hp { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; height: 8px; }
.roster.right .hp { direction: rtl; }
.hp i { background: rgba(226, 232, 244, 0.14); transition: background-color 0.25s; }
.hp i.on { background: var(--fg); }
.hp.low i.on { background: var(--atk); }
.credits { display: none; align-items: center; gap: 8px; font: 700 18px var(--ui); }
.roster.right .credits { justify-content: flex-end; }
.credits .spent { font: 600 14px var(--ui); color: var(--muted); }
.credits svg { width: 14px; height: 14px; color: var(--spike); }
.roster.buy .credits { display: flex; }
.roster.buy .hp { display: none; }
.gear { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 7px; padding: 0 14px; }
.gear-top { display: flex; align-items: center; gap: 10px; }
.shield { display: flex; align-items: center; gap: 4px; font: 700 15px var(--ui); color: var(--fg); }
.shield svg { width: 16px; height: 16px; color: rgba(238, 241, 247, 0.8); }
.ult { display: flex; gap: 3px; align-items: center; }
.ult i { width: 6px; height: 6px; transform: rotate(45deg); background: rgba(226, 232, 244, 0.2); }
.ult i.on { background: var(--fg); }
.ult.ready i { background: var(--spike); }
.abil { display: flex; gap: 8px; font: 700 12px var(--ui); color: var(--muted); }
.abil span { display: flex; align-items: center; gap: 3px; }
.abil b { display: inline-flex; gap: 2px; }
.abil b i { width: 4px; height: 10px; background: rgba(226, 232, 244, 0.18); }
.abil b i.on { background: var(--fg); }

.status-pill {
  position: absolute; left: 28px; top: 24px; padding: 8px 14px; background: var(--panel);
  font: 600 16px var(--ui); color: var(--spike); border-left: 4px solid var(--spike);
}

@media (prefers-reduced-motion: reduce) {
  .clock.spike .spike-mark { animation: none; }
  .ribbon span, .banner, .card, .score, .hp i { transition: none; }
}
@media (max-width: 640px) {
  .page h1 { font-size: 2rem; }
  .controls .sep { display: none; }
}
</style>

</head>
<body>
<div id="app"></div>

<script>
(() => {
  "use strict";

  // ---------- Modo ----------
  // ?groupCode=ABC&server=http://localhost:5200  -> partida real (fundo transparente, para o OBS)
  // ?demo                                          -> partida simulada, fundo transparente
  // sem parâmetros                                 -> página de prévia com fundo e controles
  const params = new URLSearchParams(location.search);
  const groupCode = (params.get("groupCode") || "").toUpperCase();
  const MODE = groupCode ? "live" : params.has("demo") ? "demo" : "preview";
  const SERVER = params.get("server") || "http://localhost:5200";
  const DEBUG = params.has("debug");
  const root = document.documentElement;
  const colorParam = (k) => (/^[0-9a-f]{6}$/i.test(params.get(k) || "") ? "#" + params.get(k) : null);
  if (colorParam("attack")) root.style.setProperty("--atk", colorParam("attack"));
  if (colorParam("defense")) root.style.setProperty("--def", colorParam("defense"));

  // ---------- Dados de referência (nomes internos do jogo -> nomes exibidos) ----------
  const AGENTS = {
    AggroBot: "Gekko", BountyHunter: "Fade", Breach: "Breach", Cable: "Deadlock", Cashew: "Tejo",
    Clay: "Raze", Deadeye: "Chamber", Grenadier: "KAY/O", Guide: "Skye", Gumshoe: "Cypher",
    Hunter: "Sova", Iris: "Miks", Killjoy: "Killjoy", Mage: "Harbor", Nox: "Vyse", Pandemic: "Viper",
    Pine: "Veto", Phoenix: "Phoenix", Rift: "Astra", Sarge: "Brimstone", Sequoia: "Iso", Smonk: "Clove",
    Sprinter: "Neon", Stealth: "Yoru", Terra: "Waylay", Thorne: "Sage", Vampire: "Reyna", Wraith: "Omen",
    Wushu: "Jett",
  };
  const ROLES = {
    duelist: ["Jett", "Raze", "Phoenix", "Reyna", "Yoru", "Neon", "Iso", "Waylay"],
    initiator: ["Sova", "Breach", "Skye", "KAY/O", "Fade", "Gekko", "Tejo"],
    controller: ["Brimstone", "Viper", "Omen", "Astra", "Harbor", "Clove"],
    sentinel: ["Sage", "Cypher", "Killjoy", "Chamber", "Deadlock", "Vyse", "Veto"],
  };
  const roleOf = (name) => Object.keys(ROLES).find((r) => ROLES[r].includes(name)) || "other";
  const agentName = (internal) => AGENTS[internal] || internal || "";
  const ICON = {
    duelist: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20 12 3l9 17-9-5z"/></svg>',
    initiator: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 18a10 10 0 0 1 16 0"/><path d="M8 18a5 5 0 0 1 8 0"/><circle cx="12" cy="18" r="1.6" fill="currentColor"/></svg>',
    controller: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
    sentinel: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 20 6v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/></svg>',
    other: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" transform="rotate(45 12 12)"/></svg>',
  };
  const CREDIT = '<svg viewBox="0 0 14 14" fill="currentColor"><path d="M7 0 14 7 7 14 0 7z"/><path d="M7 4 10 7 7 10 4 7z" fill="#0d111c"/></svg>';
  const SHIELD = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1 14 3.5V8c0 3.6-2.6 6.2-6 7-3.4-.8-6-3.4-6-7V3.5z"/></svg>';
  const SPIKE = '<svg viewBox="0 0 22 22" fill="#ffb547"><path d="M11 1 19 6v10l-8 5-8-5V6z"/><path d="M11 6l4 2.5v5L11 16l-4-2.5v-5z" fill="#1d1407"/></svg>';
  const WEAPON_PT = { Knife: "Faca", Unknown: "", "": "" };
  const ARMOR = { Heavy: "50", Light: "25", Regen: "R", None: "" };
  const REASON = {
    kills: "Eliminação", defused: "Spike desarmada", detonated: "Spike detonada", timeout: "Tempo esgotado",
  };
  const DURATION = { shopping: 30, combat: 100, spike: 45 };
  const fmtMoney = (n) => Math.round(n || 0).toLocaleString("pt-BR");
  const fmtTime = (s) => {
    s = Math.max(0, Math.ceil(s));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- Montagem da página ----------
  const app = document.getElementById("app");
  if (MODE === "preview") {
    app.innerHTML = `
      <main class="page">
        <div>
          <h1>HUD Looking</h1>
          <p class="lede">Prévia do overlay com uma partida simulada, acelerada para caber em poucos minutos. No OBS, o mesmo arquivo mostra a partida real que chega do servidor.</p>
        </div>
        <div class="frame"><div class="scene"></div><div class="viewport" id="viewport"></div></div>
        <div class="controls" role="toolbar" aria-label="Controles da simulação">
          <div class="group">
            <button class="btn" id="btn-play" aria-pressed="false">Pausar</button>
            <button class="btn" id="btn-speed" aria-pressed="false">Velocidade 3×</button>
          </div>
          <span class="sep" aria-hidden="true"></span>
          <div class="group">
            <button class="btn" data-jump="shopping">Ir para a compra</button>
            <button class="btn" data-jump="combat">Ir para o combate</button>
            <button class="btn" data-jump="plant">Plantar a spike</button>
            <button class="btn" data-jump="end">Encerrar a rodada</button>
          </div>
        </div>
        <section class="howto">
          <h2>Como usar no OBS</h2>
          <p>Adicione uma fonte do tipo <em>Navegador</em> com 1920 × 1080 e aponte para este arquivo, passando o endereço do seu servidor e o código da partida que o observador usou no capturador:</p>
          <pre><code>index.html?server=http://localhost:5200&amp;groupCode=SEUCODIGO</code></pre>
          <p>Para testar o visual sem partida rodando, use <code>index.html?demo</code>. As cores dos lados podem ser trocadas com <code>&amp;attack=FF5A6A&amp;defense=3EE6B5</code>.</p>
          <p>O cronômetro é estimado pelo overlay a partir da mudança de fase, porque o servidor não envia o tempo da rodada.</p>
        </section>
      </main>`;
  } else {
    document.body.classList.add("live");
    app.innerHTML = `<div class="viewport" id="viewport"></div>`;
  }

  const viewport = document.getElementById("viewport");
  viewport.innerHTML = `
    <div class="stage" id="stage">
      <div class="scorebug">
        <div class="bug-row">
          <div class="team-plate left"><span class="side-tag" id="side-l"></span><span class="tri" id="tri-l"></span><img class="logo" id="logo-l" alt="" hidden><div class="pips" id="pips-l"></div></div>
          <div class="score" id="score-l">0</div>
          <div class="clock" id="clock"><span class="spike-mark">${SPIKE}</span><span class="time" id="time">0:30</span><span class="phase" id="phase">Compra</span></div>
          <div class="score" id="score-r">0</div>
          <div class="team-plate right"><img class="logo" id="logo-r" alt="" hidden><span class="tri" id="tri-r"></span><span class="side-tag" id="side-r"></span><div class="pips" id="pips-r"></div></div>
        </div>
        <div class="ribbon" id="ribbon"><span class="l" id="rib-l"></span><span class="r" id="rib-r"></span></div>
        <div class="sub-strip"><span id="round">Rodada 1</span><span class="muted" id="event"></span><span id="map"></span></div>
      </div>
      <div class="banner" id="banner"><div class="big" id="banner-big"></div><div class="small" id="banner-small"></div></div>
      <div class="roster left" id="roster-l"></div>
      <div class="roster right" id="roster-r"></div>
      <div class="status-pill" id="status" hidden></div>
    </div>`;

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  function fit() {
    const w = viewport.clientWidth || window.innerWidth;
    stage.style.setProperty("--s", String(w / 1920));
  }
  new ResizeObserver(fit).observe(viewport);
  fit();

  // Cartões criados uma vez e atualizados a cada pacote
  function buildRoster(el) {
    el.innerHTML = `<div class="roster-head"><span>Créditos do time</span><b data-k="bank">0</b></div>`;
    const cards = [];
    for (let i = 0; i < 5; i++) {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `
        <div class="agent"><span data-k="icon"></span><span class="aname" data-k="agent"></span></div>
        <div class="body">
          <div class="line1"><span class="pname" data-k="name"></span><span class="kr" data-k="kr"></span><span class="weapon" data-k="weapon"></span></div>
          <div class="hp" data-k="hp">${"<i></i>".repeat(10)}</div>
          <div class="credits">${CREDIT}<span data-k="money"></span><span class="spent" data-k="spent"></span></div>
        </div>
        <div class="gear">
          <div class="gear-top"><span class="ult" data-k="ult"></span><span class="shield" data-k="shield"></span></div>
          <div class="abil" data-k="abil"></div>
        </div>`;
      const k = {};
      c.querySelectorAll("[data-k]").forEach((n) => (k[n.dataset.k] = n));
      k.el = c;
      el.appendChild(c);
      cards.push(k);
    }
    return { el, cards, bank: el.querySelector('[data-k="bank"]') };
  }
  const rosters = [buildRoster($("roster-l")), buildRoster($("roster-r"))];

  function setText(node, text) { if (node.textContent !== text) node.textContent = text; }
  function setHTML(node, html, cacheKey) {
    if (node._k !== cacheKey) { node.innerHTML = html; node._k = cacheKey; }
  }

  // ---------- Cronômetro local (o servidor não manda o tempo) ----------
  const clock = { phase: "", phaseAt: 0, spikeAt: null };
  let lastRound = -1;

  function render(d, now) {
    if (!d || !Array.isArray(d.teams) || d.teams.length < 2) return;
    const phase = d.roundPhase || "shopping";
    if (phase !== clock.phase || d.roundNumber !== lastRound) {
      clock.phase = phase; clock.phaseAt = now; lastRound = d.roundNumber;
      if (phase !== "combat") clock.spikeAt = null;
    }
    const planted = phase === "combat" && !!(d.spikeState && d.spikeState.planted && !d.spikeState.defused && !d.spikeState.detonated);
    if (planted && clock.spikeAt == null) clock.spikeAt = now;
    if (!planted) clock.spikeAt = null;

    let remaining = 0, total = 1, phaseLabel = "";
    if (planted) { total = DURATION.spike; remaining = total - (now - clock.spikeAt); phaseLabel = "Spike plantada"; }
    else if (phase === "shopping") { total = DURATION.shopping; remaining = total - (now - clock.phaseAt); phaseLabel = "Compra"; }
    else if (phase === "combat") { total = DURATION.combat; remaining = total - (now - clock.phaseAt); phaseLabel = "Combate"; }
    else if (phase === "end") { phaseLabel = "Fim da rodada"; }
    else if (phase === "game_end") { phaseLabel = "Fim de jogo"; }

    const showTime = phase === "shopping" || phase === "combat" || planted;
    setText($("time"), showTime ? fmtTime(remaining) : "—");
    setText($("phase"), phaseLabel);
    $("clock").classList.toggle("spike", planted);

    const frac = showTime ? Math.max(0, Math.min(1, remaining / total)) : 0;
    $("rib-l").style.transform = `scaleX(${frac})`;
    $("rib-r").style.transform = `scaleX(${frac})`;

    const [L, R] = d.teams;
    const sideColor = (t) => (t.isAttacking ? "var(--atk)" : "var(--def)");
    const ribColor = planted ? "var(--spike)" : phase === "shopping" ? null : "var(--fg)";
    $("ribbon").style.setProperty("--rib-l", ribColor || sideColor(L));
    $("ribbon").style.setProperty("--rib-r", ribColor || sideColor(R));

    [[L, "l", 0], [R, "r", 1]].forEach(([t, s, i]) => {
      setText($("tri-" + s), t.teamTricode || (t.teamName || "").slice(0, 3).toUpperCase());
      setText($("side-" + s), t.isAttacking ? "Ataque" : "Defesa");
      setText($("score-" + s), String(t.roundsWon ?? 0));
      $("score-" + s).style.setProperty("--team", sideColor(t));
      const logo = $("logo-" + s);
      if (t.teamUrl && MODE === "live") { if (logo.src !== t.teamUrl) logo.src = t.teamUrl; logo.hidden = false; } else logo.hidden = true;
      const series = d.tools && d.tools.seriesInfo;
      const need = series && series.needed > 1 ? series.needed : 0;
      const won = series ? (i === 0 ? series.wonLeft : series.wonRight) : 0;
      setHTML($("pips-" + s), Array.from({ length: need }, (_, n) => `<i class="pip${n < won ? " won" : ""}"></i>`).join(""), need + ":" + won);
      renderRoster(rosters[i], t, phase, d);
    });

    setText($("round"), "Rodada " + (d.roundNumber || 1));
    setText($("map"), d.map || "");
    const tour = d.tools && d.tools.tournamentInfo && d.tools.tournamentInfo.name;
    setText($("event"), tour || "");

    // Faixa central: pausa técnica, timeout ou fim de rodada
    const banner = $("banner");
    const ts = d.timeoutState || {};
    let big = "", small = "", color = "var(--fg)";
    if (ts.techPause) { big = "Pausa técnica"; small = "A partida volta em instantes"; }
    else if (ts.leftTeam || ts.rightTeam) {
      const t = ts.leftTeam ? L : R;
      big = "Timeout " + (t.teamTricode || t.teamName);
      small = ts.timeRemaining ? "Volta em " + fmtTime(ts.timeRemaining) : "";
      color = sideColor(t);
    } else if (phase === "end" || phase === "game_end") {
      const winner = d.attackersWon ? (L.isAttacking ? L : R) : (L.isAttacking ? R : L);
      big = (winner.teamTricode || winner.teamName) + (phase === "game_end" ? " vence o mapa" : " vence a rodada");
      const rec = (winner.roundRecord || []).find((r) => r.round === d.roundNumber && REASON[r.type]);
      small = rec ? REASON[rec.type] : "";
      color = sideColor(winner);
    }
    banner.classList.toggle("on", !!big);
    if (big) { setText($("banner-big"), big); setText($("banner-small"), small); banner.style.setProperty("--team", color); }
  }

  function renderRoster(r, team, phase, d) {
    const buy = phase === "shopping";
    r.el.classList.toggle("buy", buy);
    const players = (team.players || []).slice(0, 5);
    setText(r.bank, fmtMoney(players.reduce((a, p) => a + (p.money || 0), 0)));
    r.cards.forEach((k, i) => {
      const p = players[i];
      k.el.hidden = !p;
      if (!p) return;
      k.el.style.setProperty("--team", team.isAttacking ? "var(--atk)" : "var(--def)");
      k.el.classList.toggle("dead", !p.isAlive && phase !== "shopping");
      k.el.classList.toggle("observed", !!p.isObserved && phase === "combat");
      const name = agentName(p.agentInternal);
      setHTML(k.icon, ICON[roleOf(name)], roleOf(name));
      setText(k.agent, name);
      setText(k.name, p.name || p.fullName || "");
      const w = p.highestWeapon in WEAPON_PT ? WEAPON_PT[p.highestWeapon] : p.highestWeapon;
      setText(k.weapon, w || "");
      setText(k.kr, p.killsThisRound > 0 && !buy ? p.killsThisRound + (p.killsThisRound > 1 ? " abates" : " abate") : "");
      const hasHp = !p.auxiliaryAvailable || p.auxiliaryAvailable.health !== false;
      const hp = p.isAlive ? (hasHp ? p.health ?? 100 : 100) : 0;
      const segs = Math.ceil(hp / 10);
      const hpKey = segs + (hp <= 30 ? "l" : "");
      if (k.hp._k !== hpKey) {
        k.hp._k = hpKey;
        k.hp.classList.toggle("low", hp > 0 && hp <= 30);
        [...k.hp.children].forEach((seg, n) => seg.classList.toggle("on", n < segs));
      }
      setText(k.money, fmtMoney(p.money));
      setText(k.spent, p.moneySpent > 0 ? "gastou " + fmtMoney(p.moneySpent) : "");
      const armor = ARMOR[p.armorName] ?? "";
      setHTML(k.shield, armor ? SHIELD + armor : "", armor);
      const max = Math.min(p.maxUltPoints || 0, 9), cur = Math.min(p.currUltPoints || 0, max);
      k.ult.classList.toggle("ready", !!p.ultReady);
      setHTML(k.ult, Array.from({ length: max }, (_, n) => `<i class="${n < cur ? "on" : ""}"></i>`).join(""), max + ":" + cur);
      const ab = p.abilities || {};
      const pip = (n) => `<b>${Array.from({ length: 2 }, (_, j) => `<i class="${j < n ? "on" : ""}"></i>`).join("")}</b>`;
      const abKey = [ab.grenade, ab.ability1, ab.ability2].join(",");
      setHTML(k.abil, `<span>C${pip(ab.grenade)}</span><span>Q${pip(ab.ability1)}</span><span>E${pip(ab.ability2)}</span>`, abKey);
    });
  }

  // ---------- Partida real ----------
  if (MODE === "live") {
    const status = $("status");
    const show = (msg) => { if (DEBUG) { status.hidden = !msg; status.textContent = msg || ""; } };
    let data = null;
    const now = () => performance.now() / 1000;
    if (typeof io === "undefined") { show("Não consegui carregar o socket.io. Verifique a internet do PC do OBS."); return; }
    const socket = io(SERVER, { reconnection: true });
    const logon = () => socket.emit("logon", JSON.stringify({ groupCode }));
    show("Conectando a " + SERVER + "…");
    socket.on("connect", logon);
    socket.on("logon_success", () => show(""));
    socket.on("connect_error", () => show("Sem conexão com " + SERVER));
    socket.on("match_data", (raw) => { try { data = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { /* pacote inválido */ } });
    const loop = () => { if (data) render(data, now()); };
    setInterval(loop, 100);
    return;
  }

  // ---------- Partida simulada ----------
  const ROSTERS = [
    { teamName: "Jangada Esports", teamTricode: "JGD", players: [["kaiaque", "Jett"], ["mareh", "Omen"], ["Tucunaré", "Sova"], ["vento sul", "Killjoy"], ["cajuzin", "Breach"]] },
    { teamName: "Caatinga Club", teamTricode: "CTG", players: [["xique", "Raze"], ["mandacaru", "Viper"], ["lampião", "Fade"], ["seriema", "Cypher"], ["aboio", "Astra"]] },
  ];
  const internalOf = (name) => Object.keys(AGENTS).find((k) => AGENTS[k] === name) || name;
  const ULT = { Jett: 8, Omen: 7, Sova: 8, Killjoy: 9, Breach: 8, Raze: 8, Viper: 9, Fade: 8, Cypher: 6, Astra: 7 };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function newMatch() {
    return {
      groupCode: "DEMO", isRanked: false, isRunning: true, roundNumber: 1, roundPhase: "shopping",
      map: "Ascent", attackersWon: false, switchRound: 13, firstOtRound: 25,
      spikeState: { planted: false, defused: false, detonated: false },
      timeoutState: { techPause: false, leftTeam: false, rightTeam: false, timeRemaining: 0 },
      tools: { seriesInfo: { needed: 2, wonLeft: 1, wonRight: 0, mapInfo: [] }, tournamentInfo: { name: "Copa Litoral", logoUrl: "", backdropUrl: "" } },
      teams: ROSTERS.map((t, ti) => ({
        teamName: t.teamName, teamTricode: t.teamTricode, teamUrl: "", spentThisRound: 0,
        isAttacking: ti === 0, roundsWon: 0, roundRecord: [],
        players: t.players.map(([name, agent], pi) => ({
          name, fullName: name, playerId: ti * 5 + pi, isAlive: true, agentInternal: internalOf(agent),
          armorName: "None", money: 800, moneySpent: 0, highestWeapon: "Classic",
          currUltPoints: 0, maxUltPoints: ULT[agent] || 7, ultReady: false, hasSpike: false,
          auxiliaryAvailable: { health: true, abilities: true, scoreboard: true },
          kills: 0, deaths: 0, assists: 0, killsThisRound: 0, deathsThisRound: 0, killedPlayerNames: [],
          health: 100, isObserved: false, abilities: { grenade: 1, ability1: 2, ability2: 1 },
        })),
      })),
    };
  }

  const sim = { d: newMatch(), t: 0, speed: 3, paused: false, phaseAt: 0, nextEvent: 0, plantAt: 0, nextObs: 0, buyPlan: [] };

  function startShopping() {
    const d = sim.d;
    d.roundPhase = "shopping"; sim.phaseAt = sim.t;
    d.spikeState = { planted: false, defused: false, detonated: false };
    sim.buyPlan = [];
    d.teams.forEach((t) => {
      t.spentThisRound = 0;
      t.players.forEach((p) => {
        p.isAlive = true; p.health = 100; p.killsThisRound = 0; p.deathsThisRound = 0; p.moneySpent = 0;
        p.abilities = { grenade: 1, ability1: 2, ability2: 1 };
        p.isObserved = false;
        if (d.roundNumber === 1 || d.roundNumber === d.switchRound) { p.money = 800; p.highestWeapon = "Classic"; p.armorName = "None"; }
        // planeja a compra: arma e colete conforme o dinheiro
        let cost = 0, weapon = p.highestWeapon, armor = p.armorName;
        if (p.money >= 3900) { weapon = pick(["Vandal", "Phantom"]); armor = "Heavy"; cost = 2900 + 1000; if (Math.random() < 0.15 && p.money >= 5700) { weapon = "Operator"; cost = 4700 + 1000; } }
        else if (p.money >= 2400) { weapon = pick(["Spectre", "Bulldog", "Marshal"]); armor = "Light"; cost = Math.min(p.money - 200, 2000); }
        else if (p.money >= 1000) { weapon = pick(["Sheriff", "Ghost", "Stinger"]); armor = "Light"; cost = 900; }
        else { cost = 400; armor = "None"; }
        if (weapon === p.highestWeapon && armor === p.armorName && p.highestWeapon !== "Classic") cost = 300; // guarda a arma de rodada anterior
        sim.buyPlan.push({ p, t, cost: Math.min(cost, p.money), weapon, armor, at: rnd(2, 16) });
      });
    });
  }

  function startCombat() {
    const d = sim.d;
    sim.buyPlan.forEach((b) => applyBuy(b));
    sim.buyPlan = [];
    d.roundPhase = "combat"; sim.phaseAt = sim.t;
    sim.nextEvent = sim.t + rnd(8, 16);
    sim.plantAt = sim.t + rnd(38, 72);
    sim.nextObs = sim.t;
  }

  function applyBuy(b) {
    if (b.done) return;
    b.done = true;
    b.p.money -= b.cost; b.p.moneySpent += b.cost; b.t.spentThisRound += b.cost;
    b.p.highestWeapon = b.weapon; b.p.armorName = b.armor;
  }

  function endRound(attackersWon, reason) {
    const d = sim.d;
    if (d.roundPhase === "end") return;
    d.roundPhase = "end"; sim.phaseAt = sim.t; d.attackersWon = attackersWon;
    d.teams.forEach((t) => {
      const won = t.isAttacking === attackersWon;
      if (won) t.roundsWon++;
      t.roundRecord.push({ type: won ? reason : "lost", wasAttack: t.isAttacking, round: d.roundNumber });
      t.players.forEach((p) => {
        p.money = Math.min(9000, p.money + (won ? 3000 : 1900) + p.killsThisRound * 200);
        if (!p.isAlive) { p.highestWeapon = "Classic"; p.armorName = "None"; }
      });
    });
    d.teams.forEach((t) => t.players.forEach((p) => (p.isObserved = false)));
  }

  function nextRound() {
    const d = sim.d;
    const a = d.teams[0].roundsWon, b = d.teams[1].roundsWon;
    if (a >= 13 || b >= 13) { sim.d = newMatch(); startShopping(); return; }
    d.roundNumber++;
    if (d.roundNumber === d.switchRound) d.teams.forEach((t) => (t.isAttacking = !t.isAttacking));
    startShopping();
  }

  function plant() {
    const d = sim.d;
    const att = d.teams.find((t) => t.isAttacking);
    if (d.roundPhase !== "combat" || d.spikeState.planted || !att.players.some((p) => p.isAlive)) return;
    d.spikeState.planted = true; sim.plantAt = sim.t;
  }

  function combatEvent() {
    const d = sim.d;
    const [A, B] = d.teams;
    const alive = (t) => t.players.filter((p) => p.isAlive);
    if (!alive(A).length || !alive(B).length) return;
    const shooterTeam = Math.random() < 0.5 ? A : B;
    const targetTeam = shooterTeam === A ? B : A;
    const shooter = pick(alive(shooterTeam)), target = pick(alive(targetTeam));
    const dmg = Math.random() < 0.55 ? 999 : Math.round(rnd(20, 80));
    if (Math.random() < 0.35) { const k = pick(["grenade", "ability1", "ability2"]); shooter.abilities[k] = Math.max(0, shooter.abilities[k] - 1); }
    target.health = Math.max(0, target.health - dmg);
    if (target.health === 0) {
      target.isAlive = false; target.deaths++; target.deathsThisRound++;
      shooter.kills++; shooter.killsThisRound++; shooter.killedPlayerNames.push(target.name);
      shooter.currUltPoints = Math.min(shooter.maxUltPoints, shooter.currUltPoints + 1);
      shooter.ultReady = shooter.currUltPoints >= shooter.maxUltPoints;
      if (target.isObserved) { target.isObserved = false; sim.nextObs = sim.t; }
    }
  }

  function step(dt) {
    const d = sim.d;
    sim.t += dt;
    const el = sim.t - sim.phaseAt;
    if (d.roundPhase === "shopping") {
      sim.buyPlan.forEach((b) => { if (el >= b.at) applyBuy(b); });
      if (el >= DURATION.shopping) startCombat();
    } else if (d.roundPhase === "combat") {
      const att = d.teams.find((t) => t.isAttacking), def = d.teams.find((t) => !t.isAttacking);
      const attAlive = att.players.some((p) => p.isAlive), defAlive = def.players.some((p) => p.isAlive);
      if (sim.t >= sim.nextObs) {
        const candidates = d.teams.flatMap((t) => t.players.filter((p) => p.isAlive));
        d.teams.forEach((t) => t.players.forEach((p) => (p.isObserved = false)));
        if (candidates.length) pick(candidates).isObserved = true;
        sim.nextObs = sim.t + rnd(6, 11);
      }
      if (sim.t >= sim.nextEvent) { combatEvent(); sim.nextEvent = sim.t + rnd(3, 9); }
      if (!d.spikeState.planted && sim.t >= sim.plantAt && attAlive) plant();
      if (d.spikeState.planted) {
        if (sim.t - sim.plantAt >= DURATION.spike) { d.spikeState.detonated = true; endRound(true, "detonated"); }
        else if (!attAlive && defAlive && sim.t - sim.plantAt > 8) { d.spikeState.defused = true; endRound(false, "defused"); }
        else if (!defAlive) { endRound(true, "kills"); }
      } else {
        if (!attAlive) endRound(false, "kills");
        else if (!defAlive) endRound(true, "kills");
        else if (el >= DURATION.combat) endRound(false, "timeout");
      }
    } else if (d.roundPhase === "end") {
      if (el >= 7) nextRound();
    }
  }

  startShopping();
  let last = performance.now();
  function frame(ts) {
    const dt = Math.min(0.25, (ts - last) / 1000);
    last = ts;
    if (!sim.paused) step(dt * sim.speed);
    render(sim.d, sim.t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (MODE === "preview") {
    const playBtn = $("btn-play"), speedBtn = $("btn-speed");
    playBtn.addEventListener("click", () => {
      sim.paused = !sim.paused;
      playBtn.textContent = sim.paused ? "Continuar" : "Pausar";
      playBtn.setAttribute("aria-pressed", String(sim.paused));
    });
    speedBtn.addEventListener("click", () => {
      sim.speed = sim.speed === 3 ? 1 : 3;
      speedBtn.textContent = sim.speed === 3 ? "Velocidade 3×" : "Velocidade 1×";
      speedBtn.setAttribute("aria-pressed", String(sim.speed === 1));
    });
    document.querySelectorAll("[data-jump]").forEach((b) =>
      b.addEventListener("click", () => {
        const j = b.dataset.jump, d = sim.d;
        if (j === "shopping") { if (d.roundPhase !== "shopping") nextRound(); }
        else if (j === "combat") { if (d.roundPhase === "shopping") startCombat(); else if (d.roundPhase === "end") { nextRound(); startCombat(); } }
        else if (j === "plant") { if (d.roundPhase !== "combat") { if (d.roundPhase === "end") nextRound(); startCombat(); } plant(); }
        else if (j === "end") {
          if (d.roundPhase === "shopping") startCombat();
          if (d.roundPhase !== "combat") return;
          const attWins = Math.random() < 0.5;
          d.teams.filter((t) => t.isAttacking !== attWins).forEach((t) => t.players.forEach((p) => { p.isAlive = false; p.health = 0; }));
          endRound(attWins, "kills");
        }
      })
    );
  }
})();
</script>
</body>
</html>
