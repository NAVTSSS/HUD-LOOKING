<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Looking Broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Barlow:wght@700;800&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
/* Layout de transmissão: faixa de informações no topo com placar central (placas na cor de cada time),
   cartões compactos nas laterais durante o combate, painel de economia com histórico na compra e
   cartão animado de vitória de rodada. As cores dos times vêm do bloco CORES no script. */
:root {
  --team-l: #c8323f;
  --team-r: #14a98a;
  --hl: #f5c043;
  --base: #0b1019;
  --base-2: #111827;
  --base-3: #171f31;
  --fg: #f3f5f9;
  --muted: #8892a6;
  --loss: #ff6b6b;
  --evento: #7a1a2c;
  --chrome-bg: #06080e;
  --num: "Tungsten", "Teko", "Bahnschrift Condensed", "Arial Narrow", sans-serif;
  --ui: "Barlow Semi Condensed", "Bahnschrift", "Segoe UI", sans-serif;
  --sbn: "Barlow", "Bahnschrift", "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--chrome-bg); color: var(--fg); font-family: var(--ui); }
body.live { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
html:has(body.live), body.live { background: transparent; }
* { box-sizing: border-box; }
img { display: block; }
[hidden] { display: none !important; }

/* ---------- Página de prévia ---------- */
.page { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.page h1 { font: 600 3.2rem/0.95 var(--num); margin: 0; text-wrap: balance; }
.page .lede { margin: 8px 0 0; color: var(--muted); max-width: 66ch; line-height: 1.5; font-size: 1.05rem; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; background: #1c1f27; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.controls .sep { width: 1px; height: 26px; background: rgba(243, 245, 249, 0.12); margin-inline: 6px; }
.btn { font: 600 1rem var(--ui); color: var(--fg); background: var(--base-2); border: 0; padding: 9px 16px; cursor: pointer; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.btn:hover { background: var(--base-3); }
.btn:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--base); }
.swatch { display: flex; align-items: center; gap: 8px; font: 600 0.95rem var(--ui); color: var(--muted); }
.swatch input { width: 38px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
.note { color: var(--muted); line-height: 1.55; max-width: 76ch; margin: 0; }
.howto { display: grid; gap: 10px; max-width: 800px; line-height: 1.55; color: var(--muted); }
.howto h2 { font: 600 2rem/1 var(--num); color: var(--fg); margin: 10px 0 0; }
.howto p { margin: 0; }
.howto code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.86rem; color: var(--fg); }
.howto pre { margin: 0; padding: 12px 14px; background: var(--base-2); overflow-x: auto; }
.scene { position: absolute; inset: 0; background: radial-gradient(60% 50% at 62% 38%, rgba(214, 170, 120, 0.35), transparent 70%), linear-gradient(180deg, #4b4f5c 0%, #6b6560 45%, #7b6a58 55%, #3a3430 100%); }
.scene::after { content: ""; position: absolute; inset: 55% 0 0 0; background: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0 3px, transparent 3px 140px); transform: perspective(500px) rotateX(58deg); transform-origin: top; }

/* ---------- Palco 1920x1080 ---------- */
.viewport { position: absolute; inset: 0; overflow: hidden; }
body.live .viewport { position: fixed; }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform: scale(var(--s, 1)); transform-origin: 0 0; font-family: var(--ui); color: var(--fg); font-variant-numeric: tabular-nums; }

/* ---------- Placar: composição da referência (medidas em px do palco 1920x1080) ----------
   Faixa superior de largura total (33), bloco do evento no canto (322x88), placas de 318 com
   ponta externa a 45°, parte do nome até 62 e parte do número até 48 (degrau), fio claro na diagonal
   interna, bloco central em trapézio invertido (262 no topo, 108 na base, 78 de altura). */
.topbar { position: absolute; top: 0; left: 0; right: 0; height: 33px; display: flex; align-items: center; justify-content: space-between; padding: 0 346px 0 24px; background: rgba(8, 13, 20, 0.92); font: 600 15px var(--ui); white-space: nowrap; }
.topbar .grp { display: flex; gap: 34px; max-width: 520px; overflow: hidden; }
.topbar .k { color: var(--muted); font-weight: 500; margin-right: 8px; }
.topbar .stage-name { color: var(--fg); max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
.corner { position: absolute; top: 0; right: 0; width: 322px; height: 88px; display: grid; place-items: center; z-index: 2;
  background: linear-gradient(120deg, color-mix(in srgb, var(--evento) 100%, #fff 8%) 0%, var(--evento) 45%, color-mix(in srgb, var(--evento) 45%, #000) 100%);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 22px 100%); }
.corner img { max-width: 230px; max-height: 58px; object-fit: contain; transition: opacity 0.4s; }

.sb { position: absolute; top: 0; left: 0; width: 1920px; height: 90px; z-index: 3; pointer-events: none; }
.sbp { position: absolute; top: 0; width: 318px; height: 62px; }
.sbp.l { left: 557px; }
.sbp.r { left: 1045px; }
.sbp .fill { position: absolute; inset: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 100%, #fff 10%) 0%, var(--tc) 55%, color-mix(in srgb, var(--tc) 80%, #000) 100%); }
.sbp .fill::after { content: ""; position: absolute; inset: 0; opacity: 0.18;
  background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.5) 0 2px, transparent 2px 9px); }
.sbp.l .fill { clip-path: polygon(0 0, 272px 0, 318px 48px, 232px 48px, 218px 62px, 63px 62px); }
.sbp.r .fill { clip-path: polygon(46px 0, 318px 0, 255px 62px, 100px 62px, 86px 48px, 0 48px); }
.sbp .edge { position: absolute; inset: 0; background: color-mix(in srgb, var(--tc) 45%, #fff); }
.sbp.l .edge { clip-path: polygon(262px 0, 272px 0, 318px 48px, 307px 48px); }
.sbp.r .edge { clip-path: polygon(46px 0, 56px 0, 11px 48px, 0 48px); }
/* logo fixo perto da ponta, nome logo depois, número perto do centro; tudo centralizado na faixa de 48 px */
.sbp .who { position: absolute; left: 0; top: 0; width: 318px; height: 48px; }
.sbp .logo { position: absolute; top: 4px; width: 44px; height: 40px; object-fit: contain; }
.sbp.l .logo { left: 72px; }
.sbp.r .logo { left: 202px; }
.sbp .tri { position: absolute; top: 0; width: 84px; height: 48px; display: flex; align-items: center;
  font: 800 30px/1 var(--ui); letter-spacing: 0.03em; color: #fff; white-space: nowrap; overflow: hidden; }
.sbp.l .tri { left: 130px; justify-content: flex-start; }
.sbp.r .tri { left: 104px; justify-content: flex-end; }
.sbp .sc { position: absolute; top: 0; width: 70px; height: 48px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  font: 800 44px/1 var(--sbn); color: #fff; }
.sbp.l .sc { left: 220px; }
.sbp.r .sc { left: 28px; }
.sc .shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.5) 50%, transparent 65%); transform: translateX(-120%); }
.sc.scored .shine { animation: shine 0.8s ease-out 1; }
@keyframes shine { to { transform: translateX(120%); } }
.pips-row { position: absolute; top: 52px; height: 10px; display: flex; align-items: center; gap: 10px; }
.pips-row.l { left: 811px; }
.pips-row.r { right: 811px; flex-direction: row-reverse; }
.pips-row .side { display: none; }
.pips-row .pips { display: flex; gap: 6px; }
.pips-row .pips i { width: 22px; height: 8px; transform: skewX(-40deg); border: 1.5px solid rgba(243, 245, 249, 0.85); }
.pips-row.r .pips i { transform: skewX(40deg); }
.pips-row .pips i.won { background: #fff; border-color: #fff; }

.clock { position: absolute; top: 0; left: 829px; width: 262px; height: 78px; display: grid; justify-items: center; align-content: start;
  background: rgba(14, 19, 27, 0.96); clip-path: polygon(0 0, 262px 0, 185px 78px, 77px 78px); }
.clock .round { margin-top: 8px; font: 600 13px/1 var(--ui); color: var(--muted); letter-spacing: 0.06em; }
.clock .time { margin-top: 6px; font: 800 38px/1 var(--sbn); letter-spacing: 0.02em; color: var(--fg); }
.clock .bar { position: absolute; left: 101px; width: 60px; top: 68px; height: 3px; background: var(--fg); transform-origin: center; transition: transform 0.25s linear; }
/* spike plantada: some o tempo e a barra, fica o rótulo da rodada e o ícone da spike em vermelho */
.spike-icon { display: none; width: 52px; height: 46px; margin-top: 5px; color: var(--spike); }
.spike-icon svg { width: 52px; height: 46px; }
.spike-icon.masked { width: 56px; height: 50px; margin-top: 3px; background: var(--spike); -webkit-mask: var(--mask) center / contain no-repeat; mask: var(--mask) center / contain no-repeat; }
.clock.spike .time, .clock.spike .bar { display: none; }
.clock.spike .spike-icon { display: block; animation: spikeglow 1s ease-in-out infinite; }
@keyframes spikeglow { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 0 transparent); } 50% { opacity: 0.78; filter: drop-shadow(0 0 6px var(--spike)); } }

/* Aviso de pausa */
.pause { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); padding: 8px 24px 6px; background: rgba(11, 16, 25, 0.92); border-bottom: 3px solid var(--tc, var(--hl)); font: 600 34px/1 var(--num); letter-spacing: 0.03em; text-align: center; }
.pause small { display: block; font: 600 14px var(--ui); color: var(--muted); margin-top: 3px; }

/* ---------- Vitória de rodada: "ROUND WIN" (medidas do palco 1920x1080) ----------
   Painel de 760x132 abaixo do placar com moldura angulada, circuito na cor do time ao fundo,
   emblema do time no topo, "ROUND WIN" grande com glitch e riscos de luz, agente do destaque saindo
   pela direita, faixa "LADO ▶ TIME" e uma faixa extra para ace, clutch, rodada perfeita ou destaque. */
.rw { --e: color-mix(in srgb, var(--tc) 65%, #fff); position: absolute; top: 98px; left: 50%; width: 760px; height: 250px; margin-left: -380px; pointer-events: none; }
.rw.ace { --e: var(--hl); }
.rw-panel { position: absolute; top: 34px; left: 0; width: 760px; height: 132px; z-index: 1; }
.rw-panel svg { position: absolute; inset: 0; overflow: visible; }
.rw-panel .fr-fill { fill: url(#rwgrad); }
.rw-panel .fr-out { fill: none; stroke: rgba(255, 255, 255, 0.55); stroke-width: 1.5; }
.rw-panel .fr-in { fill: none; stroke: var(--e); stroke-width: 1.2; opacity: 0.55; }
.rw-panel .fr-tri { fill: rgba(255, 255, 255, 0.75); }
.rw-panel .g0 { stop-color: color-mix(in srgb, var(--tc) 55%, #05080b); stop-opacity: 0.94; }
.rw-panel .g1 { stop-color: color-mix(in srgb, var(--tc) 22%, #05080b); stop-opacity: 0.92; }
.rw-panel .g2 { stop-color: #05080b; stop-opacity: 0.9; }
.rw-circ { position: absolute; inset: 0; clip-path: polygon(24px 0, 736px 0, 760px 22px, 760px 96px, 722px 132px, 38px 132px, 0 96px, 0 22px); }
.rw-circ path { fill: none; stroke: color-mix(in srgb, var(--tc) 70%, #fff); stroke-width: 1.3; opacity: 0.35; stroke-dasharray: 400; stroke-dashoffset: 0; }
.rw-circ circle { fill: color-mix(in srgb, var(--tc) 70%, #fff); opacity: 0.5; }
.rw-circ rect { fill: var(--e); opacity: 0.2; }
.rw-circ .blink { animation: blink 1.8s steps(2, jump-none) infinite; animation-delay: var(--d); }
.rw-badge { position: absolute; top: 0; left: 50%; width: 76px; height: 76px; margin-left: -38px; z-index: 4; display: grid; place-items: center; border-radius: 50%;
  background: radial-gradient(circle, #0b1117 0 58%, color-mix(in srgb, var(--tc) 50%, #000) 60% 100%);
  box-shadow: 0 0 0 3px var(--e), 0 0 26px 4px color-mix(in srgb, var(--tc) 80%, transparent); }
.rw-badge::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 70%, color-mix(in srgb, var(--e) 80%, transparent) 85%, transparent 100%); z-index: -1; animation: spin 2.4s linear infinite;
  -webkit-mask: radial-gradient(circle, transparent 0 62%, #000 63%); mask: radial-gradient(circle, transparent 0 62%, #000 63%); }
.rw-logo { width: 50px; height: 50px; display: grid; place-items: center; }
.rw-logo img { width: 50px; height: 50px; object-fit: contain; }
.rw-logo span { font: 800 20px/1 var(--sbn); color: #fff; }
.rw-word { position: absolute; top: 76px; left: 50%; width: 500px; height: 54px; margin-left: -250px; z-index: 5; }
.rw.has-agent .rw-word { margin-left: -300px; }
.rw-word b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 62px/1 var(--sbn); letter-spacing: 0.05em; color: #fff; white-space: nowrap; }
.rw-word .wr { color: color-mix(in srgb, var(--tc) 80%, #fff); opacity: 0; }
.rw-word .wc { color: #6ff2ff; opacity: 0; }
.rw-word.masked b { color: transparent; font-size: 0; -webkit-mask: var(--wm) center / contain no-repeat; mask: var(--wm) center / contain no-repeat; background: #fff; }
.rw-word.masked .wr { background: color-mix(in srgb, var(--tc) 80%, #fff); }
.rw-word.masked .wc { background: #6ff2ff; }
.rw-word .wm-main { filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35)) drop-shadow(0 0 14px color-mix(in srgb, var(--tc) 70%, transparent)); }
.rw-streak { position: absolute; left: -40px; right: -40px; height: 3px; transform-origin: left; opacity: 0.9;
  background: linear-gradient(90deg, transparent, var(--e) 20%, #fff 50%, var(--e) 80%, transparent); }
.rw-streak.s1 { top: 14px; height: 2px; }
.rw-streak.s2 { top: 30px; height: 5px; left: 30px; right: -70px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--tc) 90%, #000) 25%, color-mix(in srgb, var(--tc) 70%, #fff) 60%, transparent); opacity: 0.8; }
.rw-streak.s3 { top: 42px; height: 2px; left: -80px; right: 60px; }
.rw-agent { position: absolute; right: -24px; top: -6px; width: 200px; height: 172px; z-index: 3; object-fit: cover; object-position: center 12%;
  filter: drop-shadow(0 0 14px color-mix(in srgb, var(--tc) 70%, transparent));
  -webkit-mask-image: linear-gradient(0deg, transparent 0, #000 30%); mask-image: linear-gradient(0deg, transparent 0, #000 30%); }
.rw-side { position: absolute; top: 146px; left: 50%; z-index: 5; height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 30px; translate: -50% 0; white-space: nowrap;
  background: rgba(5, 8, 11, 0.95); font: 800 19px/1 var(--sbn); letter-spacing: 0.06em; text-transform: uppercase; color: #fff;
  clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 100%, 0 100%); }
.rw-side .arr { width: 16px; height: 16px; color: var(--e); filter: drop-shadow(0 0 6px var(--e)); }
.rw-side .tm { max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.rw-strap { position: absolute; top: 192px; left: 50%; height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 24px; z-index: 5; translate: -50% 0; white-space: nowrap;
  background: color-mix(in srgb, var(--tc) 30%, rgba(5, 8, 11, 0.94)); font: 600 17px/1 var(--ui); color: var(--fg);
  clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 14px 100%); }
.rw.nostrap .rw-strap { display: none; }
.rw-strap b { font-weight: 700; color: #fff; }
.rw-strap i:not(.mk) { font-style: normal; opacity: 0.45; margin: 0 4px; }
.rw-tag { padding: 5px 10px 4px; background: var(--tc); font: 800 18px/1 var(--sbn); letter-spacing: 0.04em; color: #fff; }
.rw.ace .rw-tag { background: var(--hl); color: #0b1015; }
.rw-tag:empty { display: none; }
.rw-marks { display: flex; gap: 5px; }
.rw-marks:empty { display: none; }
.rw-marks i { width: 24px; height: 24px; display: grid; place-items: center; background: var(--e); color: #0b1015; }
.rw-marks i svg { width: 15px; height: 15px; }
.rw-line { position: absolute; top: 99px; left: -40px; right: -40px; height: 2px; z-index: 6; background: linear-gradient(90deg, transparent, #fff 30%, #fff 70%, transparent); box-shadow: 0 0 14px var(--e), 0 0 4px #fff; opacity: 0; }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, color-mix(in srgb, var(--tc) 60%, transparent) 100%); }

/* entrada */
.rw.on .rw-line { animation: line 0.5s ease-out both; }
.rw.on .rw-panel { animation: open 0.32s cubic-bezier(0.2, 0.9, 0.2, 1) 0.18s both; }
.rw.on .rw-circ path { animation: trace 1.4s ease-out 0.3s both; }
.rw.on .rw-badge { animation: badge 0.55s cubic-bezier(0.3, 1.5, 0.5, 1) 0.42s both; }
.rw.on .wm-main { animation: wordIn 0.42s cubic-bezier(0.2, 0.9, 0.2, 1) 0.4s both; }
.rw.on .wr { animation: glitchR 0.5s steps(1) 0.42s forwards, glitchR 0.32s steps(1) 2.6s 1, glitchR 0.32s steps(1) 4.4s 1; }
.rw.on .wc { animation: glitchC 0.5s steps(1) 0.46s forwards, glitchC 0.32s steps(1) 2.64s 1, glitchC 0.32s steps(1) 4.44s 1; }
.rw.on .rw-streak { animation: streak 0.7s cubic-bezier(0.2, 0.9, 0.2, 1) both; }
.rw.on .rw-streak.s1 { animation-delay: 0.5s; }
.rw.on .rw-streak.s2 { animation-delay: 0.42s; }
.rw.on .rw-streak.s3 { animation-delay: 0.58s; }
.rw.on .rw-agent { animation: agentIn 0.5s cubic-bezier(0.2, 0.9, 0.2, 1) 0.55s both; }
.rw.on .rw-side { animation: sideIn 0.3s cubic-bezier(0.2, 0.9, 0.2, 1) 0.75s both; }
.rw.on .rw-side .arr { animation: nudge 0.9s ease-in-out 1.1s infinite; }
.rw.on .rw-strap { animation: strapIn 0.3s cubic-bezier(0.2, 0.9, 0.2, 1) 1s both; }
.rw.on .rw-tag { animation: stamp 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2) 1.12s both; }
.rw.on .rw-marks i { animation: mark 0.24s ease-out calc(1.2s + var(--n) * 0.1s) both; }
.rw.ace.on .rw-panel { animation: open 0.32s cubic-bezier(0.2, 0.9, 0.2, 1) 0.18s both, shake 0.32s ease-in-out 1.12s 1; }
.flash.on { animation: flash 1.5s ease-out 1; }
/* saída: glitch rápido e o painel fecha na linha */
.rw.out .rw-word, .rw.out .rw-badge, .rw.out .rw-agent, .rw.out .rw-side, .rw.out .rw-strap { animation: outGlitch 0.2s steps(2) both; }
.rw.out .rw-panel { animation: close 0.22s ease-in 0.1s both; }
.rw.out .rw-line { animation: lineOut 0.36s ease-in both; }

@keyframes line { 0% { opacity: 0; transform: scaleX(0); } 30% { opacity: 1; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(1) scaleY(0.5); } }
@keyframes lineOut { 0% { opacity: 0; } 40% { opacity: 1; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(0); } }
@keyframes open { from { transform: scaleY(0.02); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes close { to { transform: scaleY(0.02); opacity: 0; } }
@keyframes trace { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
@keyframes blink { 0% { opacity: 0.15; } 50% { opacity: 0.9; } }
@keyframes badge { from { opacity: 0; transform: translateY(-30px) scale(0.5); } to { opacity: 1; transform: none; } }
@keyframes wordIn { 0% { opacity: 0; transform: translateX(-60px) skewX(-24deg); filter: blur(6px); } 60% { opacity: 1; transform: translateX(6px) skewX(4deg); filter: blur(0); } 100% { opacity: 1; transform: none; } }
@keyframes glitchR { 0% { opacity: 0.9; clip-path: inset(0 0 62% 0); transform: translate(-9px, -2px); } 20% { clip-path: inset(48% 0 22% 0); transform: translate(7px, 1px); } 40% { clip-path: inset(18% 0 58% 0); transform: translate(-5px, 0); } 60% { clip-path: inset(70% 0 4% 0); transform: translate(10px, 2px); } 80% { clip-path: inset(30% 0 40% 0); transform: translate(-3px, 0); } 100% { opacity: 0; } }
@keyframes glitchC { 0% { opacity: 0.85; clip-path: inset(55% 0 12% 0); transform: translate(8px, 1px); } 25% { clip-path: inset(8% 0 70% 0); transform: translate(-7px, -1px); } 50% { clip-path: inset(36% 0 36% 0); transform: translate(5px, 0); } 75% { clip-path: inset(78% 0 0 0); transform: translate(-9px, 2px); } 100% { opacity: 0; } }
@keyframes streak { 0% { opacity: 0; transform: scaleX(0) translateX(-30px); } 40% { opacity: 1; } 100% { opacity: 0.85; transform: none; } }
@keyframes agentIn { from { opacity: 0; transform: translateX(50px) scale(0.92); } to { opacity: 1; transform: none; } }
@keyframes sideIn { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateX(4px); } }

/* ---------- Combate: cartões dos jogadores (composição da referência, medidas do palco 1920x1080) ----------

.cards.r .pc > .bg { clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }

.cards.r .pc > .band { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }

.pc .face { position: absolute; top: 0; width: 66px; height: 58px; overflow: hidden;

<div id="app"></div>
<script>
(() => {
  "use strict";

  // =====================================================================
  //  CORES — mude aqui (ou pela URL: &left=C8323F&right=14A98A&hl=F5C043)
  // =====================================================================
  const CORES = {
    esquerda: "#c8323f",  // time da esquerda
    direita: "#14a98a",   // time da direita
    porLado: false,       // true: usa as cores de ataque/defesa em vez da cor de cada time
    ataque: "#e8394d",
    defesa: "#19c39c",
    destaque: "#f5c043",  // ultimate pronta
    spike: "#e8424f",     // ícone da spike plantada
    evento: "#7a1a2c",    // bloco do evento no canto superior direito
    fundo: "#0b1019",     // fundo dos painéis
  };
  // Para usar no OBS com "Arquivo local" marcado (sem parâmetros na URL), preencha aqui:
  const CONEXAO = {
    servidor: "",         // ex.: "http://localhost:5200"
    codigo: "",           // ex.: "FINAL1" (o mesmo código digitado no capturador)
  };
  // =====================================================================

  const params = new URLSearchParams(location.search);
  const groupCode = (params.get("groupCode") || CONEXAO.codigo || "").toUpperCase();
  // dentro do OBS nunca mostra a página de prévia: sempre o palco 1920x1080 com fundo transparente
  const IN_OBS = typeof window.obsstudio !== "undefined";
  const MODE = groupCode ? "live" : params.has("demo") || IN_OBS ? "demo" : "preview";
  const SERVER = params.get("server") || CONEXAO.servidor || "http://localhost:5200";
  const DEBUG = params.has("debug");
  const USE_IMAGES = params.get("images") !== "0";
  const hex = (k) => (/^[0-9a-f]{6}$/i.test(params.get(k) || "") ? "#" + params.get(k) : null);
  if (hex("left")) CORES.esquerda = hex("left");
  if (hex("right")) CORES.direita = hex("right");
  if (hex("attack")) CORES.ataque = hex("attack");
  if (hex("defense")) CORES.defesa = hex("defense");
  if (hex("hl")) CORES.destaque = hex("hl");
  if (hex("spike")) CORES.spike = hex("spike");
  if (params.get("colors") === "side") CORES.porLado = true;
  const root = document.documentElement;
  function applyColors() {
    root.style.setProperty("--team-l", CORES.esquerda);
    root.style.setProperty("--team-r", CORES.direita);
    root.style.setProperty("--hl", CORES.destaque);
    root.style.setProperty("--spike", CORES.spike);
    root.style.setProperty("--base", CORES.fundo);
    root.style.setProperty("--evento", CORES.evento);
  }
  applyColors();
  const colorOf = (i, t) => (CORES.porLado ? (t.isAttacking ? CORES.ataque : CORES.defesa) : i === 0 ? CORES.esquerda : CORES.direita);

  // ---------- Referências do jogo ----------
  const AGENTS = {
    AggroBot: "Gekko", BountyHunter: "Fade", Breach: "Breach", Cable: "Deadlock", Cashew: "Tejo",
    Clay: "Raze", Deadeye: "Chamber", Grenadier: "KAY/O", Guide: "Skye", Gumshoe: "Cypher",
    Hunter: "Sova", Iris: "Miks", Killjoy: "Killjoy", Mage: "Harbor", Nox: "Vyse", Pandemic: "Viper",
    Pine: "Veto", Phoenix: "Phoenix", Rift: "Astra", Sarge: "Brimstone", Sequoia: "Iso", Smonk: "Clove",
    Sprinter: "Neon", Stealth: "Yoru", Terra: "Waylay", Thorne: "Sage", Vampire: "Reyna", Wraith: "Omen",
    Wushu: "Jett",
  };

  function renderHistory(d, L, R) {

          else if (p.money >= 3900) { weapon = pick(["Vandal", "Phantom"]); armor = "Heavy"; }
          else if (p.money >= 2400) { weapon = pick(["Spectre", "Bulldog", "Marshal"]); armor = "Light"; }
          else if (p.money >= 1300) { weapon = pick(["Sheriff", "Ghost", "Stinger"]); armor = "Light"; }
        }
        if (armor === "None" && p.money >= 400) armor = "Light";
        let cost = (weapon !== p.highestWeapon ? COST[weapon] || 0 : 0) + (armor !== p.armorName ? COST[armor] || 0 : 0) + 200;
        sim.plan.push({ p, t, cost: Math.min(cost, p.money), weapon, armor, at: rnd(2, 16) });
      });
    });
  }
  const buy = (b) => { if (b.done) return; b.done = true; b.p.money -= b.cost; b.p.moneySpent += b.cost; b.t.spentThisRound += b.cost; b.p.highestWeapon = b.weapon; b.p.armorName = b.armor; };
  function startCombat() { sim.plan.forEach(buy); sim.plan = []; sim.d.roundPhase = "combat"; sim.at = sim.t; sim.nextEvent = sim.t + rnd(8, 16); sim.plantAt = sim.t + rnd(38, 72); sim.nextObs = sim.t; }
  function endRound(attWon, reason) {
    const d = sim.d;
    if (d.roundPhase === "end") return;
    d.roundPhase = "end"; sim.at = sim.t; d.attackersWon = attWon;
    d.teams.forEach((t) => {
      const won = t.isAttacking === attWon;
      if (won) t.roundsWon++;
      t.roundRecord.push({ type: won ? reason : "lost", wasAttack: t.isAttacking, round: d.roundNumber });
      t.players.forEach((p) => {
        p.money = Math.min(9000, p.money + (won ? 3000 : 1900) + p.killsThisRound * 200);
        if (!p.isAlive) { p.highestWeapon = "Classic"; p.armorName = "None"; }
        p.isObserved = false;
      });
    });
  }
  function nextRound() {
    const d = sim.d;
    if (d.teams.some((t) => t.roundsWon >= 13)) { sim.d = newMatch(); startShopping(); return; }
    d.roundNumber++;
    if (d.roundNumber === d.switchRound) d.teams.forEach((t) => (t.isAttacking = !t.isAttacking));
    startShopping();
  }
  function plant() {
    const d = sim.d, att = d.teams.find((t) => t.isAttacking);
    if (d.roundPhase !== "combat" || d.spikeState.planted || !att.players.some((p) => p.isAlive)) return;
    d.spikeState.planted = true; sim.plantAt = sim.t;
  }
  function fight() {
    const [A, B] = sim.d.teams;
    const alive = (t) => t.players.filter((p) => p.isAlive);
    if (!alive(A).length || !alive(B).length) return;
    const st = Math.random() < 0.5 ? A : B, tt = st === A ? B : A;
    const s = pick(alive(st)), v = pick(alive(tt));
    if (Math.random() < 0.4) { const k = pick(["grenade", "ability1", "ability2"]); s.abilities[k] = Math.max(0, s.abilities[k] - 1); }
    v.health = Math.max(0, v.health - (Math.random() < 0.55 ? 999 : Math.round(rnd(20, 80))));
    if (v.health === 0) {
      v.isAlive = false; v.deaths++; v.deathsThisRound++;
      s.kills++; s.killsThisRound++;
      const helper = alive(st).find((p) => p !== s);
      if (helper && Math.random() < 0.4) helper.assists++;
      s.currUltPoints = Math.min(s.maxUltPoints, s.currUltPoints + 1); s.ultReady = s.currUltPoints >= s.maxUltPoints;
      if (v.isObserved) { v.isObserved = false; sim.nextObs = sim.t; }
    }
  }
  function step(dt) {
    const d = sim.d;
    sim.t += dt;
    const el = sim.t - sim.at;
    if (d.roundPhase === "shopping") {
      sim.plan.forEach((b) => { if (el >= b.at) buy(b); });
      if (el >= DURATION.shopping) startCombat();
    } else if (d.roundPhase === "combat") {
      const att = d.teams.find((t) => t.isAttacking), def = d.teams.find((t) => !t.isAttacking);
      const aA = att.players.some((p) => p.isAlive), dA = def.players.some((p) => p.isAlive);
      if (sim.t >= sim.nextObs) {
        const c = d.teams.flatMap((t) => t.players.filter((p) => p.isAlive));
        d.teams.forEach((t) => t.players.forEach((p) => (p.isObserved = false)));
        if (c.length) pick(c).isObserved = true;
        sim.nextObs = sim.t + rnd(6, 11);
      }
      if (sim.t >= sim.nextEvent) { fight(); sim.nextEvent = sim.t + rnd(3, 9); }
      if (!d.spikeState.planted && sim.t >= sim.plantAt && aA) plant();
      if (d.spikeState.planted) {
        if (sim.t - sim.plantAt >= DURATION.spike) { d.spikeState.detonated = true; endRound(true, "detonated"); }
        else if (!aA && dA && sim.t - sim.plantAt > 8) { d.spikeState.defused = true; endRound(false, "defused"); }
        else if (!dA) endRound(true, "kills");
      } else if (!aA) endRound(false, "kills");
      else if (!dA) endRound(true, "kills");
      else if (el >= DURATION.combat) endRound(false, "timeout");
    } else if (d.roundPhase === "end" && el >= 9) nextRound();
  }
  // começa no meio da partida, para a prévia já mostrar histórico e economia
  startShopping();
  sim.speed = 1;
  for (let i = 0; i < 1800 && sim.d.roundNumber < 10; i++) step(0.5);
  sim.speed = 3;

  let last = performance.now();
  function frame(ts) {
    const dt = Math.min(0.25, (ts - last) / 1000); last = ts;
    if (!sim.paused) step(dt * sim.speed);
    render(sim.d, sim.t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (MODE === "preview") {
    const note = $("img-note");
    const updNote = () => setText(note, LOCAL.base
      ? "Imagens carregadas da pasta de recursos (" + LOCAL.base + ")."
      : ASSETS.ready ? "Imagens oficiais do jogo carregadas da internet."
      : "Esta prévia mostra ícones próprios no lugar das imagens do jogo, porque a página publicada não pode carregar imagens de outros sites. Aberto no navegador ou no OBS, com a pasta Resources ao lado, aparecem retratos, habilidades, armas e logos.");
    updNote(); setTimeout(updNote, 4000);
    const pb = $("btn-play"), sb = $("btn-speed");
    pb.addEventListener("click", () => { sim.paused = !sim.paused; pb.textContent = sim.paused ? "Continuar" : "Pausar"; pb.setAttribute("aria-pressed", String(sim.paused)); });
    sb.addEventListener("click", () => { sim.speed = sim.speed === 3 ? 1 : 3; sb.textContent = sim.speed === 3 ? "Velocidade 3×" : "Velocidade 1×"; sb.setAttribute("aria-pressed", String(sim.speed === 1)); });
    document.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
      const j = b.dataset.jump, d = sim.d;
      if (j === "shopping") { if (d.roundPhase !== "shopping") nextRound(); }
      else if (j === "combat") { if (d.roundPhase === "end") nextRound(); if (sim.d.roundPhase === "shopping") startCombat(); }
      else if (j === "plant") { if (d.roundPhase === "end") nextRound(); if (sim.d.roundPhase === "shopping") startCombat(); plant(); }
      else forceWin(j);
    }));
    // Força um fim de rodada para ver cada animação
    function forceWin(kind) {
      if (sim.d.roundPhase === "end") nextRound();
      if (sim.d.roundPhase === "shopping") startCombat();
      const d = sim.d;
      d.spikeState.planted = false;
      sim.nextEvent = sim.t + 999; sim.plantAt = sim.t + 999;
      const attWins = Math.random() < 0.5;
      const W = d.teams.find((t) => t.isAttacking === attWins), Lo = d.teams.find((t) => t.isAttacking !== attWins);
      [W, Lo].forEach((t) => t.players.forEach((p) => { p.isAlive = true; p.health = 100; p.killsThisRound = 0; p.deathsThisRound = 0; }));
      const die = (p) => { p.isAlive = false; p.health = 0; p.deaths++; p.deathsThisRound++; };
      const star = pick(W.players);
      const killBy = (by, list) => list.forEach((p) => { if (p.isAlive) { die(p); by.kills++; by.killsThisRound++; } });
      if (kind === "ace") { killBy(star, Lo.players); endRound(attWins, "kills"); return; }
      if (kind === "clutch") {
        W.players.forEach((p) => { if (p !== star) die(p); });
        killBy(pick(W.players), Lo.players.slice(0, 2));
        star.health = 34;
        setTimeout(() => { if (sim.d === d && d.roundPhase === "combat") { killBy(star, Lo.players); endRound(attWins, "kills"); } }, 700);
        return;
      }
      die(W.players[0]);
      const alive = W.players.filter((p) => p.isAlive);
      Lo.players.forEach((p, n) => killBy(alive[n % 2 === 0 ? 0 : 1 + (n % (alive.length - 1))], [p]));
      endRound(attWins, "kills");
    }
    const cl = $("c-left"), cr = $("c-right");
    cl.value = CORES.esquerda; cr.value = CORES.direita;
    cl.addEventListener("input", () => { CORES.esquerda = cl.value; applyColors(); });
    cr.addEventListener("input", () => { CORES.direita = cr.value; applyColors(); });
  }
})();
</script>
</body>
</html>
