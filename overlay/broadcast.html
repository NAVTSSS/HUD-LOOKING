<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Looking Broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
/* Layout de transmissão: faixa de informações no topo com placar central (placas na cor de cada time),
   cartões compactos nas laterais durante o combate, painel de economia com histórico na compra e
   cartão animado de vitória de rodada. As cores dos times vêm do bloco CORES no script. */
:root {
  --team-l: #c8323f;
  --team-r: #14a98a;
  --hl: #f5c043;
  --base: #0b1019;
  --base-2: #111827;
  --base-3: #171f31;
  --fg: #f3f5f9;
  --muted: #8892a6;
  --loss: #ff6b6b;
  --chrome-bg: #06080e;
  --num: "Tungsten", "Teko", "Bahnschrift Condensed", "Arial Narrow", sans-serif;
  --ui: "Barlow Semi Condensed", "Bahnschrift", "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--chrome-bg); color: var(--fg); font-family: var(--ui); }
html:has(body.live), body.live { background: transparent; }
* { box-sizing: border-box; }
img { display: block; }
[hidden] { display: none !important; }

/* ---------- Página de prévia ---------- */
.page { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.page h1 { font: 600 3.2rem/0.95 var(--num); margin: 0; text-wrap: balance; }
.page .lede { margin: 8px 0 0; color: var(--muted); max-width: 66ch; line-height: 1.5; font-size: 1.05rem; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; background: #1c1f27; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.controls .sep { width: 1px; height: 26px; background: rgba(243, 245, 249, 0.12); margin-inline: 6px; }
.btn { font: 600 1rem var(--ui); color: var(--fg); background: var(--base-2); border: 0; padding: 9px 16px; cursor: pointer; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.btn:hover { background: var(--base-3); }
.btn:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--base); }
.swatch { display: flex; align-items: center; gap: 8px; font: 600 0.95rem var(--ui); color: var(--muted); }
.swatch input { width: 38px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
.note { color: var(--muted); line-height: 1.55; max-width: 76ch; margin: 0; }
.howto { display: grid; gap: 10px; max-width: 800px; line-height: 1.55; color: var(--muted); }
.howto h2 { font: 600 2rem/1 var(--num); color: var(--fg); margin: 10px 0 0; }
.howto p { margin: 0; }
.howto code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.86rem; color: var(--fg); }
.howto pre { margin: 0; padding: 12px 14px; background: var(--base-2); overflow-x: auto; }
.scene { position: absolute; inset: 0; background: radial-gradient(60% 50% at 62% 38%, rgba(214, 170, 120, 0.35), transparent 70%), linear-gradient(180deg, #4b4f5c 0%, #6b6560 45%, #7b6a58 55%, #3a3430 100%); }
.scene::after { content: ""; position: absolute; inset: 55% 0 0 0; background: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0 3px, transparent 3px 140px); transform: perspective(500px) rotateX(58deg); transform-origin: top; }

/* ---------- Palco 1920x1080 ---------- */
.viewport { position: absolute; inset: 0; overflow: hidden; }
body.live .viewport { position: fixed; }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform: scale(var(--s, 1)); transform-origin: 0 0; font-family: var(--ui); color: var(--fg); font-variant-numeric: tabular-nums; }

/* Faixa superior */
.topbar { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: linear-gradient(180deg, rgba(11, 16, 25, 0.95), rgba(11, 16, 25, 0.82)); font: 600 17px var(--ui); }
.topbar .group { display: flex; gap: 28px; white-space: pre; }
.topbar .k { color: var(--muted); font-weight: 500; margin-right: 8px; }
.topbar .right { padding-right: 250px; }
.corner { position: absolute; top: 0; right: 0; width: 236px; height: 92px; display: grid; place-items: center; background: var(--base); clip-path: polygon(0 0, 100% 0, 100% 100%, 22px 100%); }
.corner::after { content: ""; position: absolute; left: 22px; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--team-l), var(--team-r)); }
.corner img { max-width: 170px; max-height: 58px; object-fit: contain; transition: opacity 0.4s; }

/* Placar */
.bug { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 420px 176px 420px; height: 76px; z-index: 2; }
.tp { position: relative; display: flex; align-items: center; gap: 16px; padding: 0 22px; overflow: hidden; }
.tp.l { justify-content: flex-end; background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 18%, var(--base)) 0%, color-mix(in srgb, var(--tc) 70%, var(--base)) 62%, var(--tc) 100%); clip-path: polygon(0 0, 100% 0, 100% 100%, 30px 100%); }
.tp.r { justify-content: flex-start; background: linear-gradient(270deg, color-mix(in srgb, var(--tc) 18%, var(--base)) 0%, color-mix(in srgb, var(--tc) 70%, var(--base)) 62%, var(--tc) 100%); clip-path: polygon(0 0, 100% 0, calc(100% - 30px) 100%, 0 100%); }
.tp .logo { width: 48px; height: 48px; object-fit: contain; }
.tp .tri { font: 600 46px/1 var(--num); letter-spacing: 0.03em; padding-top: 5px; }
.tp .score { font: 600 74px/1 var(--num); min-width: 64px; text-align: center; padding-top: 6px; }
.tp .shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.35) 50%, transparent 60%); transform: translateX(-120%); pointer-events: none; }
.tp.scored .shine { animation: shine 0.9s ease-out 1; }
@keyframes shine { to { transform: translateX(120%); } }
.under { position: absolute; top: 76px; display: flex; align-items: center; gap: 10px; height: 22px; padding: 0 14px; background: var(--base); font: 600 14px var(--ui); color: var(--muted); }
.under.l { right: calc(50% + 88px); clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%); }
.under.r { left: calc(50% + 88px); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
.under .side { color: var(--tc); }
.under .pips { display: flex; gap: 4px; }
.under .pips i { width: 16px; height: 5px; transform: skewX(-20deg); background: rgba(243, 245, 249, 0.18); }
.under .pips i.won { background: var(--tc); }
.clock { position: relative; display: grid; place-items: center; align-content: center; background: var(--base); }
.clock .round { font: 600 15px var(--ui); color: var(--muted); }
.clock .time { font: 600 56px/0.9 var(--num); letter-spacing: 0.03em; }
.clock .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--fg); transform-origin: center; transition: transform 0.25s linear; }
.clock.spike { background: var(--hl); }
.clock.spike .time, .clock.spike .round { color: var(--base); }
.clock.spike .bar { background: var(--base); }
.spike-icon { position: absolute; left: 10px; top: 50%; width: 22px; height: 22px; margin-top: -11px; opacity: 0; }
.spike-icon svg, .spike-icon img { width: 22px; height: 22px; }
.spike-icon img { filter: brightness(0); }
.clock.spike .spike-icon { opacity: 1; animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.75); } }

/* Aviso de pausa */
.pause { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); padding: 10px 28px 8px; background: var(--base); border-bottom: 4px solid var(--tc, var(--hl)); font: 600 40px/1 var(--num); letter-spacing: 0.03em; text-align: center; }
.pause small { display: block; font: 600 16px var(--ui); color: var(--muted); margin-top: 4px; }

/* ---------- Cartão de vitória de rodada ---------- */
.win { position: absolute; top: 132px; left: 50%; width: 820px; height: 168px; transform: translateX(-50%); pointer-events: none; }
.win[hidden] { display: none !important; }
.win .beam { position: absolute; left: -60px; right: -60px; top: 50%; height: 120px; margin-top: -60px; background: radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--tc) 70%, transparent), transparent 70%); opacity: 0; }
.win .panel { position: absolute; inset: 0 40px; background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 22%, var(--base)) 0%, var(--base) 40%, var(--base) 70%, color-mix(in srgb, var(--tc) 30%, var(--base)) 100%); clip-path: polygon(28px 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 28px 100%, 0 50%); overflow: hidden; }
.win .panel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--tc); }
.win .panel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.22) 50%, transparent 65%); transform: translateX(-120%); }
.win .mvp { position: absolute; left: 40px; bottom: 0; width: 200px; height: 186px; object-fit: cover; object-position: center top; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 30%, #000 70%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 30%, #000 70%, transparent 100%); opacity: 0; }
.win .txt { position: absolute; left: 250px; right: 200px; top: 0; bottom: 0; display: grid; align-content: center; justify-items: center; text-align: center; gap: 4px; }
.win .rnd { font: 600 16px var(--ui); color: var(--muted); padding: 2px 12px; background: rgba(243, 245, 249, 0.07); opacity: 0; }
.win .who { font: 600 72px/0.9 var(--num); letter-spacing: 0.03em; white-space: nowrap; padding-top: 6px; opacity: 0; }
.win .how { font: 600 18px var(--ui); color: var(--tc); opacity: 0; }
.win .how b { color: var(--fg); font-weight: 700; }
.win .badge { position: absolute; right: 74px; top: 50%; width: 112px; height: 112px; margin-top: -56px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, color-mix(in srgb, var(--tc) 45%, var(--base)), var(--base) 72%); box-shadow: 0 0 0 3px var(--tc); opacity: 0; }
.win .badge img { width: 70px; height: 70px; object-fit: contain; }
.win .badge span { font: 600 40px/1 var(--num); padding-top: 4px; }
.win .badge::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 3px var(--tc); opacity: 0; }
/* entrada em etapas */
.win.on .beam { animation: beam 1.2s ease-out forwards; }
.win.on .panel { animation: unfold 0.5s cubic-bezier(0.2, 0.9, 0.2, 1) 0.1s both; }
.win.on .panel::after { animation: sweep 0.9s ease-out 0.55s 1; }
.win.on .mvp { animation: slideR 0.5s ease-out 0.45s forwards; }
.win.on .rnd { animation: up 0.35s ease-out 0.35s forwards; }
.win.on .who { animation: up 0.4s cubic-bezier(0.2, 0.9, 0.2, 1) 0.42s forwards; }
.win.on .how { animation: up 0.35s ease-out 0.55s forwards; }
.win.on .badge { animation: pop 0.45s cubic-bezier(0.3, 1.5, 0.5, 1) 0.5s forwards; }
.win.on .badge::after { animation: ring 0.9s ease-out 0.85s 1; }
.win.out { animation: fold 0.35s ease-in forwards; }
@keyframes beam { 0% { opacity: 0; transform: scaleX(0.2); } 30% { opacity: 1; transform: scaleX(1); } 100% { opacity: 0.55; transform: scaleX(1); } }
@keyframes unfold { from { clip-path: polygon(50% 0, 50% 0, 50% 50%, 50% 100%, 50% 100%, 50% 50%); } to { clip-path: polygon(28px 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 28px 100%, 0 50%); } }
@keyframes sweep { to { transform: translateX(120%); } }
@keyframes slideR { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(0.55) rotate(-12deg); } to { opacity: 1; transform: none; } }
@keyframes ring { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.45); } }
@keyframes fold { to { opacity: 0; transform: translateX(-50%) scaleY(0.2); } }

/* ---------- Combate: cartões compactos ---------- */
.cards { position: absolute; bottom: 22px; width: 318px; display: grid; gap: 8px; transition: opacity 0.3s, transform 0.3s; }
.cards.l { left: 16px; }
.cards.r { right: 16px; }
.stage.buy .cards { opacity: 0; transform: translateY(30px); }
.pc { position: relative; height: 82px; display: grid; grid-template-columns: 76px 1fr; background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 16%, var(--base)), var(--base) 55%); transition: transform 0.25s; }
.cards.r .pc { grid-template-columns: 1fr 76px; background: linear-gradient(270deg, color-mix(in srgb, var(--tc) 16%, var(--base)), var(--base) 55%); }
.cards.r .pc .face { order: 2; }
.pc::before { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; background: var(--tc); z-index: 2; }
.cards.l .pc::before { left: 0; }
.cards.r .pc::before { right: 0; }
.cards.l .pc.observed { transform: translateX(10px); }
.cards.r .pc.observed { transform: translateX(-10px); }
.pc.observed { box-shadow: 0 0 0 2px var(--tc); }
.face { position: relative; background: linear-gradient(0deg, color-mix(in srgb, var(--tc) 60%, #000), color-mix(in srgb, var(--tc) 15%, transparent)); }
.face img { position: absolute; left: 0; bottom: 0; width: 76px; height: 82px; object-fit: cover; object-position: center top; }
.cards.r .face img { transform: scaleX(-1); }
.ph { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2px; font: 600 18px var(--num); color: #fff; }
.ph svg { width: 28px; height: 28px; color: #fff; }
.face .ult { position: absolute; bottom: -4px; width: 30px; height: 30px; z-index: 3; }
.cards.l .face .ult { right: -12px; }
.cards.r .face .ult { left: -12px; }
.pc.dead .face { background: #1a1f2a; }
.pc.dead .face img { filter: grayscale(1) brightness(0.45); }
.pc.dead .body { opacity: 0.4; }
.body { display: grid; align-content: center; gap: 5px; padding: 0 12px 0 22px; min-width: 0; }
.cards.r .body { padding: 0 22px 0 12px; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cards.r .row { flex-direction: row-reverse; }
.pname { font: 600 26px/0.9 var(--num); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; padding-top: 3px; }
.cards.r .pname { text-align: right; }
.kda { font: 600 15px var(--ui); color: var(--fg); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.eye { width: 15px; height: 15px; color: var(--tc); display: none; }
.pc.observed .eye { display: block; }
.sh { display: inline-grid; place-items: center; min-width: 24px; height: 18px; padding: 0 3px; font: 700 12px var(--ui); color: var(--base); background: var(--fg); clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); }
.sh.none { visibility: hidden; }
.hpn { font: 600 28px/0.9 var(--num); min-width: 36px; padding-top: 3px; }
.cards.r .hpn { text-align: right; }
.hpbar { flex: 1; height: 5px; background: rgba(243, 245, 249, 0.12); position: relative; overflow: hidden; }
.hpbar i { position: absolute; inset: 0; background: var(--tc); transform-origin: left; transition: transform 0.25s; }
.cards.r .hpbar i { transform-origin: right; }
.hpbar.low i { background: var(--loss); }
.kit { justify-content: space-between; }
.abils { display: flex; gap: 8px; align-items: flex-end; }
.ab { display: grid; justify-items: center; gap: 2px; width: 22px; }
.ab .ic { width: 20px; height: 20px; object-fit: contain; filter: brightness(0) invert(1); }
.ab .lt { width: 20px; height: 20px; display: grid; place-items: center; font: 700 12px var(--ui); color: var(--muted); background: rgba(243, 245, 249, 0.08); }
.ab.empty .ic, .ab.empty .lt { opacity: 0.25; }
.dots { display: flex; gap: 2px; height: 4px; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--fg); }
.ult { position: relative; width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--base); }
.ult svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ult .track { stroke: rgba(243, 245, 249, 0.16); }
.ult .fill { stroke: var(--tc); transition: stroke-dashoffset 0.3s; }
.ult .uic { position: absolute; inset: 7px; width: 16px; height: 16px; object-fit: contain; filter: brightness(0) invert(1); }
.ult.ready { background: var(--hl); }
.ult.ready .fill { stroke: var(--hl); }
.ult.ready .uic { filter: brightness(0); }
.weap { height: 22px; max-width: 92px; object-fit: contain; filter: brightness(0) invert(1); }
.cards.r .weap { transform: scaleX(-1); }
.wtxt { font: 600 14px var(--ui); color: var(--muted); white-space: nowrap; }

/* ---------- Compra: painel de economia ---------- */
.econ { position: absolute; left: 24px; right: 24px; bottom: 16px; display: grid; gap: 3px; opacity: 0; transform: translateY(30px); transition: opacity 0.35s, transform 0.35s; pointer-events: none; }
.stage.buy .econ { opacity: 1; transform: none; }
.econ-head { display: grid; grid-template-columns: 430px 1fr 430px; height: 92px; gap: 3px; }
.plate { position: relative; display: flex; align-items: center; gap: 18px; padding: 0 28px; overflow: hidden; }
.plate.l { background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 85%, #000), color-mix(in srgb, var(--tc) 40%, var(--base))); justify-content: flex-end; text-align: right; }
.plate.r { background: linear-gradient(270deg, color-mix(in srgb, var(--tc) 85%, #000), color-mix(in srgb, var(--tc) 40%, var(--base))); }
.plate .wm { position: absolute; top: 50%; width: 190px; height: 190px; margin-top: -95px; object-fit: contain; opacity: 0.16; }
.plate.l .wm { left: -30px; }
.plate.r .wm { right: -30px; }
.plate > div { position: relative; min-width: 0; }
.plate .tn { font: 600 56px/0.9 var(--num); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 4px; }
.plate .val { font: 600 17px var(--ui); color: rgba(255, 255, 255, 0.8); }
.plate .val b { color: #fff; font-weight: 700; }
.mid { display: grid; grid-template-columns: 110px 150px 1fr 110px; gap: 3px; }
.to { display: grid; align-content: center; justify-items: center; gap: 6px; background: var(--base); font: 600 15px var(--ui); color: var(--muted); }
.to b { display: flex; gap: 4px; }
.to b i { width: 20px; height: 5px; transform: skewX(-20deg); background: rgba(243, 245, 249, 0.16); }
.to b i.on { background: var(--tc); }
.mini { position: relative; overflow: hidden; display: grid; align-content: center; padding: 0 16px; background: var(--base); font: 600 32px/1.05 var(--num); }
.mini .art { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.22; }
.mini > :not(.art) { position: relative; }
.mini .mr { display: flex; justify-content: space-between; }
.mini .mr span:last-child { color: var(--tc); }
.hist { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; gap: 3px; padding: 7px; background: var(--base); }
.hc { display: grid; place-items: center; font: 600 22px var(--num); color: rgba(243, 245, 249, 0.32); background: rgba(243, 245, 249, 0.04); padding-top: 2px; }
.hc.won { background: var(--tc); color: #fff; }
.hc.won svg { width: 18px; height: 18px; color: #fff; }
.hc.now { color: var(--fg); box-shadow: inset 0 0 0 2px var(--fg); }
.hc.half { margin-left: 10px; }
.econ-body { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.erows { display: grid; gap: 2px; }
.er { display: grid; grid-template-columns: 74px 92px 112px 34px 34px 112px 48px minmax(0, 1fr) 88px; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: var(--base); position: relative; }
.er:nth-child(even) { background: var(--base-2); }
.erows.r .er { direction: rtl; }
.erows.r .er > * { direction: ltr; }
.er::after { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; background: var(--tc); }
.erows.l .er::after { left: 0; }
.erows.r .er::after { right: 0; }
.er .spent { font: 600 25px/1 var(--num); color: var(--loss); text-align: right; padding-top: 3px; }
.er .cr { font: 600 27px/1 var(--num); display: flex; align-items: center; gap: 6px; justify-content: flex-end; padding-top: 3px; }
.erows.r .er .spent { text-align: left; }
.erows.r .er .cr { justify-content: flex-start; }
.cr svg, .cv { width: 14px; height: 14px; object-fit: contain; color: var(--hl); margin-top: -3px; }
.er .abils { justify-content: center; }
.er .wc { display: flex; justify-content: center; }
.er .shc { display: flex; justify-content: center; }
.er .shc img { height: 24px; width: auto; filter: brightness(0) invert(1); }
.er .fs { position: relative; width: 48px; height: 52px; overflow: hidden; align-self: end; background: linear-gradient(0deg, color-mix(in srgb, var(--tc) 65%, #000), transparent); }
.er .fs img { width: 48px; height: 52px; object-fit: cover; object-position: center top; }
.erows.r .er .fs img { transform: scaleX(-1); }
.er .fs .ph span { display: none; }
.er .fs .ph svg { width: 22px; height: 22px; }
.er .nm { font: 600 29px/1 var(--num); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding-top: 3px; }
.erows.r .er .nm { text-align: right; }
.er .kd { font: 600 17px var(--ui); text-align: right; }
.erows.r .er .kd { text-align: left; }
.erows.r .er .weap { transform: scaleX(-1); }

.status-pill { position: absolute; left: 24px; top: 50px; padding: 8px 14px; background: var(--base); font: 600 17px var(--ui); color: var(--hl); }

@media (prefers-reduced-motion: reduce) {
  .win.on .beam, .win.on .panel, .win.on .panel::after, .win.on .mvp, .win.on .rnd, .win.on .who, .win.on .how, .win.on .badge, .win.on .badge::after, .win.out, .tp.scored .shine, .clock.spike .spike-icon { animation: none; }
  .win.on .beam, .win.on .mvp, .win.on .rnd, .win.on .who, .win.on .how, .win.on .badge { opacity: 1; }
  .cards, .econ, .hpbar i, .clock .bar, .ult .fill, .pc { transition: none; }
}
@media (max-width: 640px) { .page h1 { font-size: 2.4rem; } .controls .sep { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  "use strict";

  // =====================================================================
  //  CORES — mude aqui (ou pela URL: &left=C8323F&right=14A98A&hl=F5C043)
  // =====================================================================
  const CORES = {
    esquerda: "#c8323f",  // time da esquerda
    direita: "#14a98a",   // time da direita
    porLado: false,       // true: usa as cores de ataque/defesa em vez da cor de cada time
    ataque: "#e8394d",
    defesa: "#19c39c",
    destaque: "#f5c043",  // spike plantada e ultimate pronta
    fundo: "#0b1019",     // fundo dos painéis
  };
  // =====================================================================

  const params = new URLSearchParams(location.search);
  const groupCode = (params.get("groupCode") || "").toUpperCase();
  const MODE = groupCode ? "live" : params.has("demo") ? "demo" : "preview";
  const SERVER = params.get("server") || "http://localhost:5200";
  const DEBUG = params.has("debug");
  const USE_IMAGES = params.get("images") !== "0";
  const hex = (k) => (/^[0-9a-f]{6}$/i.test(params.get(k) || "") ? "#" + params.get(k) : null);
  if (hex("left")) CORES.esquerda = hex("left");
  if (hex("right")) CORES.direita = hex("right");
  if (hex("attack")) CORES.ataque = hex("attack");
  if (hex("defense")) CORES.defesa = hex("defense");
  if (hex("hl")) CORES.destaque = hex("hl");
  if (params.get("colors") === "side") CORES.porLado = true;
  const root = document.documentElement;
  function applyColors() {
    root.style.setProperty("--team-l", CORES.esquerda);
    root.style.setProperty("--team-r", CORES.direita);
    root.style.setProperty("--hl", CORES.destaque);
    root.style.setProperty("--base", CORES.fundo);
  }
  applyColors();
  const colorOf = (i, t) => (CORES.porLado ? (t.isAttacking ? CORES.ataque : CORES.defesa) : i === 0 ? CORES.esquerda : CORES.direita);

  // ---------- Referências do jogo ----------
  const AGENTS = {
    AggroBot: "Gekko", BountyHunter: "Fade", Breach: "Breach", Cable: "Deadlock", Cashew: "Tejo",
    Clay: "Raze", Deadeye: "Chamber", Grenadier: "KAY/O", Guide: "Skye", Gumshoe: "Cypher",
    Hunter: "Sova", Iris: "Miks", Killjoy: "Killjoy", Mage: "Harbor", Nox: "Vyse", Pandemic: "Viper",
    Pine: "Veto", Phoenix: "Phoenix", Rift: "Astra", Sarge: "Brimstone", Sequoia: "Iso", Smonk: "Clove",
    Sprinter: "Neon", Stealth: "Yoru", Terra: "Waylay", Thorne: "Sage", Vampire: "Reyna", Wraith: "Omen",
    Wushu: "Jett",
  };
  const ROLES = {
    duelist: ["Jett", "Raze", "Phoenix", "Reyna", "Yoru", "Neon", "Iso", "Waylay"],
    initiator: ["Sova", "Breach", "Skye", "KAY/O", "Fade", "Gekko", "Tejo"],
    controller: ["Brimstone", "Viper", "Omen", "Astra", "Harbor", "Clove"],
    sentinel: ["Sage", "Cypher", "Killjoy", "Chamber", "Deadlock", "Vyse", "Veto"],
  };
  const agentName = (internal) => AGENTS[internal] || Object.entries(AGENTS).find(([k]) => k.toLowerCase() === String(internal || "").toLowerCase())?.[1] || internal || "";
  const roleOf = (n) => Object.keys(ROLES).find((r) => ROLES[r].includes(n)) || "other";
  const GLYPH = {
    duelist: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20 12 3l9 17-9-5z"/></svg>',
    initiator: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 18a10 10 0 0 1 16 0"/><path d="M8 18a5 5 0 0 1 8 0"/><circle cx="12" cy="18" r="1.6" fill="currentColor"/></svg>',
    controller: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
    sentinel: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 20 6v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/></svg>',
    other: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" transform="rotate(45 12 12)"/></svg>',
  };
  const CREDIT = '<svg viewBox="0 0 14 14" fill="currentColor"><path d="M7 0 14 7 7 14 0 7z"/><path d="M7 4 10 7 7 10 4 7z" fill="#0b1019"/></svg>';
  const SPIKE = '<svg viewBox="0 0 22 22" fill="#0b1019"><path d="M11 1 19 6v10l-8 5-8-5V6z"/></svg>';
  const EYE = '<svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>';
  const REASON_ICON = {
    kills: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="7"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg>',
    defused: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 2 20 6v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
    detonated: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.4 6.2L21 5l-3.6 5.6L23 13l-6.3 1.4L18 21l-6-3.6L6 21l1.3-6.6L1 13l5.6-2.4L3 5l6.6 2.2z"/></svg>',
    timeout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 2h12M6 22h12M7 2c0 6 10 6 10 10S7 16 7 22M17 2c0 6-10 6-10 10s10 4 10 10"/></svg>',
  };
  const REASON_TEXT = { kills: "Eliminação", defused: "Spike desarmada", detonated: "Spike detonada", timeout: "Tempo esgotado" };
  const ARMOR = { Heavy: "50", Light: "25", Regen: "R" };
  const COST = { Classic: 0, Shorty: 150, Frenzy: 450, Ghost: 500, Sheriff: 800, Stinger: 1100, Spectre: 1600, Bucky: 850, Judge: 1850, Bulldog: 2050, Guardian: 2250, Phantom: 2900, Vandal: 2900, Marshal: 950, Outlaw: 2400, Operator: 4700, Ares: 1600, Odin: 3200, Heavy: 1000, Light: 400, Regen: 650 };
  const DURATION = { shopping: 30, combat: 100, spike: 45 };
  const money = (n) => Math.round(n || 0).toLocaleString("pt-BR");
  const fmtTime = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  // ---------- Imagens: pasta local > internet (valorant-api.com) > ícones próprios ----------
  const ASSETS = { agents: {}, weapons: {}, shields: {}, ready: false };
  async function loadAssets() {
    if (!USE_IMAGES) return;
    try {
      const get = (u) => fetch(u).then((r) => (r.ok ? r.json() : Promise.reject(r.status)));
      const [ag, wp, gr] = await Promise.all([
        get("https://valorant-api.com/v1/agents?isPlayableCharacter=true"),
        get("https://valorant-api.com/v1/weapons"),
        get("https://valorant-api.com/v1/gear"),
      ]);
      (ag.data || []).forEach((a) => {
        const abil = {};
        (a.abilities || []).forEach((x) => { if (x.slot && x.displayIcon) abil[x.slot.toLowerCase()] = x.displayIcon; });
        const entry = { portrait: a.displayIcon, abil };
        if (a.developerName) ASSETS.agents[a.developerName.toLowerCase()] = entry;
        if (a.displayName) ASSETS.agents[a.displayName.toLowerCase()] = entry;
      });
      (wp.data || []).forEach((w) => { ASSETS.weapons[w.displayName.toLowerCase()] = w.killStreamIcon || w.displayIcon; });
      (gr.data || []).forEach((g) => {
        const n = (g.displayName || "").toLowerCase();
        if (n.includes("heavy")) ASSETS.shields.Heavy = g.displayIcon;
        else if (n.includes("light")) ASSETS.shields.Light = g.displayIcon;
        else if (n.includes("regen")) ASSETS.shields.Regen = g.displayIcon;
      });
      ASSETS.ready = true;
    } catch (e) { ASSETS.ready = false; }
  }
  const LOCAL = { base: null, sponsors: [] };
  const FOLDER = { "KAY/O": "Kayo" };
  const MAP_NAMES = { Triad: "Haven", Bonsai: "Split", Duality: "Bind", Port: "Icebox", Foxtrot: "Breeze", Canyon: "Fracture", Pitt: "Pearl", Jam: "Lotus", Juliett: "Sunset", Infinity: "Abyss", Rook: "Corrode" };
  const mapName = (m) => MAP_NAMES[m] || m || "";
  const probe = (src, ms = 2500) => new Promise((ok) => {
    const im = new Image(); const t = setTimeout(() => ok(false), ms);
    im.onload = () => { clearTimeout(t); ok(true); }; im.onerror = () => { clearTimeout(t); ok(false); };
    im.src = src;
  });
  async function loadLocal() {
    if (!USE_IMAGES) return;
    const given = params.get("assets");
    const candidates = given ? [given.endsWith("/") ? given : given + "/"] : ["Resources/", "./"];
    for (const base of candidates) if (await probe(base + "Agentes/Jett/Jett.png")) { LOCAL.base = base; break; }
    if (!LOCAL.base) return;
    try { const f = new FontFace("Tungsten", `url("${LOCAL.base}Tungsten-Bold.ttf")`); document.fonts.add(await f.load()); } catch (e) { /* sem a fonte: usa Teko */ }
    for (let i = 1; i <= 12; i++) { const src = `${LOCAL.base}Sponsors/Sponsor${i}.png`; if (await probe(src, 1500)) LOCAL.sponsors.push(src); else break; }
  }
  function localAgent(internal) {
    const n = agentName(internal); if (!n) return null;
    const f = FOLDER[n] || n, b = `${LOCAL.base}Agentes/${f}/`;
    return { portrait: `${b}${f}.png`, abil: { grenade: b + "C.png", ability1: b + "Q.png", ability2: b + "E.png", ultimate: b + "X.png" } };
  }
  const LOCAL_SHIELD = { Heavy: "Escudo50.png", Light: "Escudo100.png", Regen: "EscudoReg.png" };
  const agentAsset = (internal) => (LOCAL.base ? localAgent(internal) : null) || ASSETS.agents[String(internal || "").toLowerCase()] || ASSETS.agents[agentName(internal).toLowerCase()] || null;
  const weaponAsset = (w) => (LOCAL.base && w ? `${LOCAL.base}Armas/${w}.png` : null) || ASSETS.weapons[String(w || "").toLowerCase()] || null;
  const shieldAsset = (a) => (LOCAL.base && LOCAL_SHIELD[a] ? `${LOCAL.base}Escudos/${LOCAL_SHIELD[a]}` : null) || ASSETS.shields[a] || null;
  const teamLogo = (t, i) => (MODE === "live" && t.teamUrl ? t.teamUrl : LOCAL.base ? `${LOCAL.base}Logos/logo${i + 1}.png` : "");

  // ---------- Página ----------
  const app = document.getElementById("app");
  if (MODE === "preview") {
    app.innerHTML = `
      <main class="page">
        <div>
          <h1>HUD Looking Broadcast</h1>
          <p class="lede">Layout de transmissão com cores por time, cartões compactos no combate, painel de economia na compra e animação de vitória de rodada. A partida é simulada.</p>
        </div>
        <div class="frame"><div class="scene"></div><div class="viewport" id="viewport"></div></div>
        <div class="controls" role="toolbar" aria-label="Controles da simulação">
          <div class="group">
            <button class="btn" id="btn-play" aria-pressed="false">Pausar</button>
            <button class="btn" id="btn-speed" aria-pressed="false">Velocidade 3×</button>
          </div>
          <span class="sep" aria-hidden="true"></span>
          <div class="group">
            <button class="btn" data-jump="shopping">Ir para a compra</button>
            <button class="btn" data-jump="combat">Ir para o combate</button>
            <button class="btn" data-jump="plant">Plantar a spike</button>
            <button class="btn" data-jump="end">Mostrar vitória de rodada</button>
          </div>
          <span class="sep" aria-hidden="true"></span>
          <div class="group">
            <label class="swatch" for="c-left">Esquerda <input type="color" id="c-left"></label>
            <label class="swatch" for="c-right">Direita <input type="color" id="c-right"></label>
          </div>
        </div>
        <p class="note" id="img-note"></p>
        <section class="howto">
          <h2>Como usar no OBS</h2>
          <p>Fonte <em>Navegador</em> de 1920 × 1080 com a URL do arquivo e os parâmetros:</p>
          <pre><code>broadcast.html?server=http://localhost:5200&amp;groupCode=SEUCODIGO&amp;left=C8323F&amp;right=14A98A</code></pre>
          <p><code>left</code> e <code>right</code> são as cores dos times em hexadecimal, sem <code>#</code>. Também dá para mudar no bloco <code>CORES</code> no começo do script. Com <code>&amp;colors=side</code> as cores passam a seguir o lado (ataque e defesa). Para testar sem partida, use <code>broadcast.html?demo</code>.</p>
        </section>
      </main>`;
  } else {
    document.body.classList.add("live");
    app.innerHTML = `<div class="viewport" id="viewport"></div>`;
  }

  const viewport = document.getElementById("viewport");
  viewport.innerHTML = `
    <div class="stage" id="stage">
      <div class="topbar"><div class="group"><span id="ev"></span><span><span class="k">Mapa</span><span id="map"></span></span><span id="series"></span></div></div>
      <div class="corner" id="corner"><img id="corner-img" alt="" hidden></div>
      <div class="bug">
        <div class="tp l" id="tp-l"><i class="shine"></i><img class="logo" id="logo-l" alt="" hidden><span class="tri" id="tri-l"></span><span class="score" id="score-l">0</span></div>
        <div class="clock" id="clock"><span class="spike-icon" id="spike-icon">${SPIKE}</span><span class="round" id="round">Rodada 1</span><span class="time" id="time">0:30</span><i class="bar" id="bar"></i></div>
        <div class="tp r" id="tp-r"><i class="shine"></i><span class="score" id="score-r">0</span><span class="tri" id="tri-r"></span><img class="logo" id="logo-r" alt="" hidden></div>
      </div>
      <div class="under l" id="un-l"><span class="pips" id="pips-l"></span><span class="side" id="side-l"></span></div>
      <div class="under r" id="un-r"><span class="side" id="side-r"></span><span class="pips" id="pips-r"></span></div>
      <div class="pause" id="pause" hidden><span id="pause-t"></span><small id="pause-s"></small></div>
      <div class="win" id="win" hidden>
        <i class="beam"></i>
        <div class="panel"></div>
        <img class="mvp" id="win-mvp" alt="" hidden>
        <div class="txt"><span class="rnd" id="win-rnd"></span><span class="who" id="win-who"></span><span class="how" id="win-how"></span></div>
        <div class="badge" id="win-badge"></div>
      </div>
      <div class="cards l" id="cards-l"></div>
      <div class="cards r" id="cards-r"></div>
      <div class="econ">
        <div class="econ-head">
          <div class="plate l" id="pl-l"><img class="wm" id="wm-l" alt="" hidden><div><div class="tn" id="tn-l"></div><div class="val">Valor do equipamento <b id="eq-l"></b></div></div></div>
          <div class="mid">
            <div class="to" id="to-l"><span>Pausas</span><b id="tob-l"></b></div>
            <div class="mini"><i class="art" id="map-art"></i><div class="mr" id="mini-l"><span></span><span></span></div><div class="mr" id="mini-r"><span></span><span></span></div></div>
            <div class="hist" id="hist"></div>
            <div class="to" id="to-r"><span>Pausas</span><b id="tob-r"></b></div>
          </div>
          <div class="plate r" id="pl-r"><img class="wm" id="wm-r" alt="" hidden><div><div class="tn" id="tn-r"></div><div class="val">Valor do equipamento <b id="eq-r"></b></div></div></div>
        </div>
        <div class="econ-body"><div class="erows l" id="er-l"></div><div class="erows r" id="er-r"></div></div>
      </div>
      <div class="status-pill" id="status" hidden></div>
    </div>`;

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const fit = () => stage.style.setProperty("--s", String((viewport.clientWidth || innerWidth) / 1920));
  new ResizeObserver(fit).observe(viewport);
  fit();
  stage.addEventListener("error", (e) => { if (e.target.tagName === "IMG" && (e.target.classList.contains("logo") || e.target.classList.contains("wm") || e.target.id === "win-mvp")) e.target.hidden = true; }, true);

  const setText = (n, t) => { if (n.textContent !== t) n.textContent = t; };
  const setHTML = (n, h, key) => { if (n._k !== key) { n._k = key; n.innerHTML = h; } };
  const setImg = (img, src) => { if (src) { if (img.getAttribute("src") !== src) { img.hidden = false; img.src = src; } } else img.hidden = true; };

  function faceHTML(internal) {
    const a = agentAsset(internal), n = agentName(internal);
    if (a && a.portrait) return `<img src="${a.portrait}" alt="${n}">`;
    return `<div class="ph">${GLYPH[roleOf(n)]}<span>${n}</span></div>`;
  }
  function abilsHTML(internal, ab) {
    const a = agentAsset(internal);
    return [["grenade", "C"], ["ability1", "Q"], ["ability2", "E"]].map(([slot, key]) => {
      const n = (ab && ab[slot]) || 0;
      const icon = a && a.abil[slot] ? `<img class="ic" src="${a.abil[slot]}" alt="${key}">` : `<span class="lt">${key}</span>`;
      return `<div class="ab${n ? "" : " empty"}">${icon}<span class="dots">${"<i></i>".repeat(Math.min(n, 3))}</span></div>`;
    }).join("");
  }
  function ultHTML(internal, cur, max, ready) {
    const a = agentAsset(internal);
    const C = 2 * Math.PI * 12.5, frac = max ? Math.min(1, cur / max) : 0;
    const ic = a && a.abil.ultimate ? `<img class="uic" src="${a.abil.ultimate}" alt="">` : "";
    return `<svg viewBox="0 0 30 30"><circle class="track" cx="15" cy="15" r="12.5" fill="none" stroke-width="3"/><circle class="fill" cx="15" cy="15" r="12.5" fill="none" stroke-width="3" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (ready ? 1 : frac))}"/></svg>${ic}`;
  }
  function weaponHTML(w) {
    const src = weaponAsset(w);
    if (src) return `<img class="weap" src="${src}" alt="${w}">`;
    return `<span class="wtxt">${w === "Knife" ? "Faca" : w || ""}</span>`;
  }

  function buildCards(el) {
    const out = [];
    for (let i = 0; i < 5; i++) {
      const c = document.createElement("div");
      c.className = "pc";
      c.innerHTML = `
        <div class="face"><span data-k="face"></span><span class="ult" data-k="ult"></span></div>
        <div class="body">
          <div class="row"><span class="pname" data-k="name"></span><span class="kda">${EYE}<span data-k="kda"></span></span></div>
          <div class="row"><span class="sh" data-k="sh"></span><span class="hpn" data-k="hpn"></span><span class="hpbar" data-k="hpb"><i></i></span></div>
          <div class="row kit"><span class="abils" data-k="ab"></span><span data-k="wp"></span></div>
        </div>`;
      const k = { el: c };
      c.querySelectorAll("[data-k]").forEach((n) => (k[n.dataset.k] = n));
      el.appendChild(c);
      out.push(k);
    }
    return out;
  }
  function buildRows(el) {
    const out = [];
    for (let i = 0; i < 5; i++) {
      const r = document.createElement("div");
      r.className = "er";
      r.innerHTML = `<span class="spent" data-k="spent"></span><span class="cr" data-k="cr"></span><span class="abils" data-k="ab"></span><span class="ult" data-k="ult"></span><span class="shc" data-k="sh"></span><span class="wc" data-k="wp"></span><span class="fs" data-k="face"></span><span class="nm" data-k="name"></span><span class="kd" data-k="kd"></span>`;
      const k = { el: r };
      r.querySelectorAll("[data-k]").forEach((n) => (k[n.dataset.k] = n));
      el.appendChild(r);
      out.push(k);
    }
    return out;
  }
  const cards = [buildCards($("cards-l")), buildCards($("cards-r"))];
  const rows = [buildRows($("er-l")), buildRows($("er-r"))];

  const clock = { phase: "", at: 0, spikeAt: null };
  let lastRound = -1;
  const lastScore = [null, null];
  const win = { key: "", hideTimer: null };

  function render(d, now) {
    if (!d || !Array.isArray(d.teams) || d.teams.length < 2) return;
    const imgKey = LOCAL.base ? "loc" : ASSETS.ready ? "img" : "no";
    const phase = d.roundPhase || "shopping";
    if (phase !== clock.phase || d.roundNumber !== lastRound) { clock.phase = phase; clock.at = now; lastRound = d.roundNumber; }
    const planted = phase === "combat" && !!(d.spikeState && d.spikeState.planted && !d.spikeState.defused && !d.spikeState.detonated);
    if (planted && clock.spikeAt == null) clock.spikeAt = now;
    if (!planted) clock.spikeAt = null;

    let rem = 0, tot = 1;
    if (planted) { tot = DURATION.spike; rem = tot - (now - clock.spikeAt); }
    else if (phase === "shopping") { tot = DURATION.shopping; rem = tot - (now - clock.at); }
    else if (phase === "combat") { tot = DURATION.combat; rem = tot - (now - clock.at); }
    const timed = phase === "shopping" || phase === "combat";
    setText($("time"), timed ? fmtTime(rem) : "0:00");
    setText($("round"), planted ? "Spike plantada" : "Rodada " + (d.roundNumber || 1));
    $("clock").classList.toggle("spike", planted);
    $("bar").style.transform = `scaleX(${timed ? Math.max(0, Math.min(1, rem / tot)) : 0})`;
    stage.classList.toggle("buy", phase === "shopping");

    const tools = d.tools || {};
    setText($("ev"), (tools.tournamentInfo && tools.tournamentInfo.name) || "Partida");
    setText($("map"), mapName(d.map));
    const series = tools.seriesInfo;
    setText($("series"), series && series.needed > 1 ? `MD${series.needed * 2 - 1}  ${series.wonLeft}–${series.wonRight}` : "");
    const art = $("map-art"), artSrc = LOCAL.base && d.map ? `url("${LOCAL.base}Maps/${mapName(d.map)}.png")` : "none";
    if (art._k !== artSrc) { art._k = artSrc; art.style.backgroundImage = artSrc; }

    const [L, R] = d.teams;
    const tri = (t) => t.teamTricode || (t.teamName || "").slice(0, 3).toUpperCase();
    const toc = tools.timeoutCounter;

    [[L, "l", 0], [R, "r", 1]].forEach(([t, s, i]) => {
      const c = colorOf(i, t);
      ["tp-", "un-", "cards-", "er-", "pl-", "mini-", "to-"].forEach((p) => $(p + s).style.setProperty("--tc", c));
      setText($("tri-" + s), tri(t));
      const sc = String(t.roundsWon ?? 0);
      setText($("score-" + s), sc);
      if (lastScore[i] !== null && lastScore[i] !== sc) { const tp = $("tp-" + s); tp.classList.remove("scored"); void tp.offsetWidth; tp.classList.add("scored"); }
      lastScore[i] = sc;
      setText($("side-" + s), t.isAttacking ? "Ataque" : "Defesa");
      const logo = teamLogo(t, i);
      setImg($("logo-" + s), logo); setImg($("wm-" + s), logo);
      const need = series && series.needed > 1 ? series.needed : 0, won = series ? (i ? series.wonRight : series.wonLeft) : 0;
      setHTML($("pips-" + s), Array.from({ length: need }, (_, n) => `<i class="${n < won ? "won" : ""}"></i>`).join(""), need + ":" + won);
      setText($("tn-" + s), t.teamName || tri(t));
      const eq = (t.players || []).reduce((a, p) => a + (COST[p.highestWeapon] || 0) + (COST[p.armorName] || 0), 0);
      setText($("eq-" + s), "¤ " + money(eq));
      const mini = $("mini-" + s).children; setText(mini[0], tri(t)); setText(mini[1], sc);
      if (toc) setHTML($("tob-" + s), Array.from({ length: toc.max || 0 }, (_, n) => `<i class="${n < (i ? toc.right : toc.left) ? "on" : ""}"></i>`).join(""), [toc.max, toc.left, toc.right].join());
      renderCards(cards[i], t, imgKey);
      renderRows(rows[i], t, imgKey);
    });
    renderHistory(d, L, R);
    renderPause(d, L, R, tri);
    renderWin(d, phase, L, R, tri);
  }

  function renderPause(d, L, R, tri) {
    const ts = d.timeoutState || {}, box = $("pause");
    let t = "", sub = "", c = "";
    if (ts.techPause) { t = "Pausa técnica"; sub = "A partida volta em instantes"; }
    else if (ts.leftTeam || ts.rightTeam) { const tm = ts.leftTeam ? L : R; t = "Pausa tática " + tri(tm); sub = ts.timeRemaining ? "Volta em " + fmtTime(ts.timeRemaining) : ""; c = colorOf(ts.leftTeam ? 0 : 1, tm); }
    box.hidden = !t;
    if (t) { setText($("pause-t"), t); setText($("pause-s"), sub); box.style.setProperty("--tc", c || CORES.destaque); }
  }

  // Cartão de vitória: aparece quando a rodada termina e sai quando a próxima começa
  function renderWin(d, phase, L, R, tri) {
    const box = $("win");
    const ended = phase === "end" || phase === "game_end";
    if (!ended) {
      if (win.key) { win.key = ""; box.classList.remove("on"); box.classList.add("out"); clearTimeout(win.hideTimer); win.hideTimer = setTimeout(() => { box.hidden = true; box.classList.remove("out"); }, 380); }
      return;
    }
    const wi = d.attackersWon ? (L.isAttacking ? 0 : 1) : (L.isAttacking ? 1 : 0);
    const w = wi ? R : L;
    const key = d.roundNumber + ":" + wi + ":" + phase;
    if (win.key === key) return;
    win.key = key;
    clearTimeout(win.hideTimer);
    const rec = (w.roundRecord || []).find((r) => r.round === d.roundNumber && REASON_TEXT[r.type]);
    const mvp = (w.players || []).slice().sort((a, b) => (b.killsThisRound || 0) - (a.killsThisRound || 0))[0];
    box.style.setProperty("--tc", colorOf(wi, w));
    setText($("win-rnd"), phase === "game_end" ? "Fim do mapa" : "Rodada " + d.roundNumber);
    setText($("win-who"), phase === "game_end" ? `${w.teamName || tri(w)} vence o mapa` : w.teamName || tri(w));
    const side = w.isAttacking ? "Ataque" : "Defesa";
    const reason = rec ? REASON_TEXT[rec.type] : "";
    const mvpTxt = mvp && mvp.killsThisRound > 0 ? `  <b>${mvp.name}</b> ${mvp.killsThisRound} ${mvp.killsThisRound > 1 ? "abates" : "abate"}` : "";
    $("win-how").innerHTML = `${side}${reason ? " · " + reason : ""}${mvpTxt}`;
    const logo = teamLogo(w, wi);
    $("win-badge").innerHTML = logo ? `<img src="${logo}" alt="">` : `<span>${tri(w)}</span>`;
    const a = mvp && mvp.killsThisRound > 0 ? agentAsset(mvp.agentInternal) : null;
    setImg($("win-mvp"), a && a.portrait);
    box.hidden = false;
    box.classList.remove("on", "out"); void box.offsetWidth; box.classList.add("on");
  }

  function renderCards(list, team, imgKey) {
    const ps = (team.players || []).slice(0, 5);
    list.forEach((k, i) => {
      const p = ps[i];
      k.el.hidden = !p; if (!p) return;
      k.el.classList.toggle("dead", !p.isAlive);
      k.el.classList.toggle("observed", !!p.isObserved && p.isAlive);
      setHTML(k.face, faceHTML(p.agentInternal), imgKey + p.agentInternal);
      setText(k.name, p.name || p.fullName || "");
      setText(k.kda, `${p.kills ?? 0}/${p.deaths ?? 0}/${p.assists ?? 0}`);
      const armor = ARMOR[p.armorName];
      k.sh.classList.toggle("none", !armor || !p.isAlive); setText(k.sh, armor || "");
      const hasHp = !p.auxiliaryAvailable || p.auxiliaryAvailable.health !== false;
      const hp = p.isAlive ? (hasHp ? p.health ?? 100 : 100) : 0;
      setText(k.hpn, p.isAlive ? String(hp) : "");
      k.hpb.classList.toggle("low", hp > 0 && hp <= 30);
      k.hpb.firstChild.style.transform = `scaleX(${hp / 100})`;
      const ab = p.abilities || {};
      setHTML(k.ab, abilsHTML(p.agentInternal, ab), imgKey + [p.agentInternal, ab.grenade, ab.ability1, ab.ability2].join());
      k.ult.classList.toggle("ready", !!p.ultReady);
      setHTML(k.ult, ultHTML(p.agentInternal, p.currUltPoints || 0, p.maxUltPoints || 0, p.ultReady), imgKey + [p.agentInternal, p.currUltPoints, p.maxUltPoints, p.ultReady].join());
      setHTML(k.wp, p.isAlive ? weaponHTML(p.highestWeapon) : "", imgKey + p.isAlive + p.highestWeapon);
    });
  }
  function renderRows(list, team, imgKey) {
    const ps = (team.players || []).slice(0, 5);
    list.forEach((k, i) => {
      const p = ps[i];
      k.el.hidden = !p; if (!p) return;
      setText(k.spent, p.moneySpent > 0 ? "-" + money(p.moneySpent) : "");
      setHTML(k.cr, (LOCAL.base ? `<img class="cv" src="${LOCAL.base}Escudos/CV.png" alt="">` : CREDIT) + `<span>${money(p.money)}</span>`, imgKey + p.money);
      const ab = p.abilities || {};
      setHTML(k.ab, abilsHTML(p.agentInternal, ab), imgKey + [p.agentInternal, ab.grenade, ab.ability1, ab.ability2].join());
      k.ult.classList.toggle("ready", !!p.ultReady);
      setHTML(k.ult, ultHTML(p.agentInternal, p.currUltPoints || 0, p.maxUltPoints || 0, p.ultReady), imgKey + [p.agentInternal, p.currUltPoints, p.maxUltPoints, p.ultReady].join());
      const armor = ARMOR[p.armorName], shSrc = shieldAsset(p.armorName);
      setHTML(k.sh, armor ? (shSrc ? `<img src="${shSrc}" alt="${armor}">` : `<span class="sh">${armor}</span>`) : "", imgKey + p.armorName);
      setHTML(k.wp, weaponHTML(p.highestWeapon), imgKey + p.highestWeapon);
      setHTML(k.face, faceHTML(p.agentInternal), imgKey + p.agentInternal);
      setText(k.name, p.name || p.fullName || "");
      setText(k.kd, `${p.kills ?? 0}/${p.deaths ?? 0}/${p.assists ?? 0}`);
    });
  }
  function renderHistory(d, L, R) {
    const total = Math.max(24, d.roundNumber || 1), start = Math.max(1, total - 23);
    const recL = {}, recR = {};
    (L.roundRecord || []).forEach((r) => (recL[r.round] = r));
    (R.roundRecord || []).forEach((r) => (recR[r.round] = r));
    const key = [start, d.roundNumber, (L.roundRecord || []).length, (R.roundRecord || []).length, CORES.esquerda, CORES.direita, CORES.porLado, L.isAttacking].join();
    const hist = $("hist");
    if (hist._k === key) return;
    hist._k = key;
    let html = "";
    for (let n = start; n < start + 24; n++) {
      const cell = (rec, ti, team) => {
        const half = n === (d.switchRound || 13) ? " half" : "";
        if (rec && REASON_ICON[rec.type]) {
          const c = CORES.porLado ? (rec.wasAttack ? CORES.ataque : CORES.defesa) : colorOf(ti, team);
          return `<div class="hc won${half}" style="--tc:${c}">${REASON_ICON[rec.type]}</div>`;
        }
        return `<div class="hc${half}${n === d.roundNumber ? " now" : ""}">${String(n).padStart(2, "0")}</div>`;
      };
      html += cell(recL[n], 0, L) + cell(recR[n], 1, R);
    }
    hist.innerHTML = html;
  }

  function startSponsors() {
    const img = $("corner-img");
    const list = LOCAL.sponsors;
    if (!list.length) return;
    let n = 0;
    setImg(img, list[0]);
    if (list.length > 1) setInterval(() => {
      n = (n + 1) % list.length;
      img.style.opacity = "0";
      setTimeout(() => { img.src = list[n]; img.style.opacity = "1"; }, 400);
    }, 6000);
  }

  // ---------- Partida real ----------
  loadLocal().then(() => {
    if (LOCAL.base) $("spike-icon").innerHTML = `<img src="${LOCAL.base}spike.png" alt="">`;
    startSponsors();
  });
  loadAssets();
  if (MODE === "live") {
    const status = $("status");
    const show = (m) => { if (DEBUG) { status.hidden = !m; status.textContent = m || ""; } };
    if (typeof io === "undefined") { show("Não consegui carregar o socket.io. Verifique a internet do PC do OBS."); return; }
    let data = null;
    const socket = io(SERVER, { reconnection: true });
    const logon = () => socket.emit("logon", JSON.stringify({ groupCode }));
    show("Conectando a " + SERVER + "…");
    socket.on("connect", logon);
    socket.on("logon_success", () => show(""));
    socket.on("connect_error", () => show("Sem conexão com " + SERVER));
    socket.on("match_data", (raw) => { try { data = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { /* pacote inválido */ } });
    setInterval(() => { if (data) render(data, performance.now() / 1000); }, 100);
    return;
  }

  // ---------- Partida simulada ----------
  const ROSTERS = [
    { teamName: "Jangada Esports", teamTricode: "JGD", players: [["kaiaque", "Jett"], ["mareh", "Omen"], ["Tucunaré", "Sova"], ["vento sul", "Killjoy"], ["cajuzin", "Breach"]] },
    { teamName: "Caatinga Club", teamTricode: "CTG", players: [["xique", "Raze"], ["mandacaru", "Viper"], ["lampião", "Fade"], ["seriema", "Cypher"], ["aboio", "Astra"]] },
  ];
  const internalOf = (n) => Object.keys(AGENTS).find((k) => AGENTS[k] === n) || n;
  const ULT = { Jett: 8, Omen: 7, Sova: 8, Killjoy: 9, Breach: 8, Raze: 8, Viper: 9, Fade: 8, Cypher: 6, Astra: 7 };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  function newMatch() {
    return {
      groupCode: "DEMO", roundNumber: 1, roundPhase: "shopping", map: "Ascent", attackersWon: false, switchRound: 13, firstOtRound: 25,
      spikeState: { planted: false, defused: false, detonated: false },
      timeoutState: { techPause: false, leftTeam: false, rightTeam: false, timeRemaining: 0 },
      tools: { seriesInfo: { needed: 2, wonLeft: 1, wonRight: 0, mapInfo: [] }, tournamentInfo: { name: "Copa Litoral", logoUrl: "", backdropUrl: "" }, timeoutCounter: { max: 2, left: 2, right: 1 } },
      teams: ROSTERS.map((t, ti) => ({
        teamName: t.teamName, teamTricode: t.teamTricode, teamUrl: "", spentThisRound: 0, isAttacking: ti === 0, roundsWon: 0, roundRecord: [],
        players: t.players.map(([name, agent], pi) => ({
          name, fullName: name, playerId: ti * 5 + pi, isAlive: true, agentInternal: internalOf(agent), armorName: "None", money: 800, moneySpent: 0,
          highestWeapon: "Classic", currUltPoints: 0, maxUltPoints: ULT[agent] || 7, ultReady: false, hasSpike: false,
          auxiliaryAvailable: { health: true, abilities: true, scoreboard: true },
          kills: 0, deaths: 0, assists: 0, killsThisRound: 0, deathsThisRound: 0, killedPlayerNames: [], health: 100, isObserved: false,
          abilities: { grenade: 1, ability1: 2, ability2: 1 },
        })),
      })),
    };
  }
  const sim = { d: newMatch(), t: 0, speed: 3, paused: false, at: 0, nextEvent: 0, plantAt: 0, nextObs: 0, plan: [] };
  function startShopping() {
    const d = sim.d;
    d.roundPhase = "shopping"; sim.at = sim.t; sim.plan = [];
    d.spikeState = { planted: false, defused: false, detonated: false };
    d.teams.forEach((t) => {
      t.spentThisRound = 0;
      t.players.forEach((p) => {
        p.isAlive = true; p.health = 100; p.killsThisRound = 0; p.deathsThisRound = 0; p.moneySpent = 0; p.isObserved = false;
        p.abilities = { grenade: 1, ability1: 2, ability2: 1 };
        if (d.roundNumber === 1 || d.roundNumber === d.switchRound) { p.money = 800; p.highestWeapon = "Classic"; p.armorName = "None"; }
        let weapon = p.highestWeapon, armor = p.armorName;
        if (p.highestWeapon === "Classic" || p.money >= 3900) {
          if (p.money >= 5700 && Math.random() < 0.15) { weapon = "Operator"; armor = "Heavy"; }
          else if (p.money >= 3900) { weapon = pick(["Vandal", "Phantom"]); armor = "Heavy"; }
          else if (p.money >= 2400) { weapon = pick(["Spectre", "Bulldog", "Marshal"]); armor = "Light"; }
          else if (p.money >= 1300) { weapon = pick(["Sheriff", "Ghost", "Stinger"]); armor = "Light"; }
        }
        if (armor === "None" && p.money >= 400) armor = "Light";
        let cost = (weapon !== p.highestWeapon ? COST[weapon] || 0 : 0) + (armor !== p.armorName ? COST[armor] || 0 : 0) + 200;
        sim.plan.push({ p, t, cost: Math.min(cost, p.money), weapon, armor, at: rnd(2, 16) });
      });
    });
  }
  const buy = (b) => { if (b.done) return; b.done = true; b.p.money -= b.cost; b.p.moneySpent += b.cost; b.t.spentThisRound += b.cost; b.p.highestWeapon = b.weapon; b.p.armorName = b.armor; };
  function startCombat() { sim.plan.forEach(buy); sim.plan = []; sim.d.roundPhase = "combat"; sim.at = sim.t; sim.nextEvent = sim.t + rnd(8, 16); sim.plantAt = sim.t + rnd(38, 72); sim.nextObs = sim.t; }
  function endRound(attWon, reason) {
    const d = sim.d;
    if (d.roundPhase === "end") return;
    d.roundPhase = "end"; sim.at = sim.t; d.attackersWon = attWon;
    d.teams.forEach((t) => {
      const won = t.isAttacking === attWon;
      if (won) t.roundsWon++;
      t.roundRecord.push({ type: won ? reason : "lost", wasAttack: t.isAttacking, round: d.roundNumber });
      t.players.forEach((p) => {
        p.money = Math.min(9000, p.money + (won ? 3000 : 1900) + p.killsThisRound * 200);
        if (!p.isAlive) { p.highestWeapon = "Classic"; p.armorName = "None"; }
        p.isObserved = false;
      });
    });
  }
  function nextRound() {
    const d = sim.d;
    if (d.teams.some((t) => t.roundsWon >= 13)) { sim.d = newMatch(); startShopping(); return; }
    d.roundNumber++;
    if (d.roundNumber === d.switchRound) d.teams.forEach((t) => (t.isAttacking = !t.isAttacking));
    startShopping();
  }
  function plant() {
    const d = sim.d, att = d.teams.find((t) => t.isAttacking);
    if (d.roundPhase !== "combat" || d.spikeState.planted || !att.players.some((p) => p.isAlive)) return;
    d.spikeState.planted = true; sim.plantAt = sim.t;
  }
  function fight() {
    const [A, B] = sim.d.teams;
    const alive = (t) => t.players.filter((p) => p.isAlive);
    if (!alive(A).length || !alive(B).length) return;
    const st = Math.random() < 0.5 ? A : B, tt = st === A ? B : A;
    const s = pick(alive(st)), v = pick(alive(tt));
    if (Math.random() < 0.4) { const k = pick(["grenade", "ability1", "ability2"]); s.abilities[k] = Math.max(0, s.abilities[k] - 1); }
    v.health = Math.max(0, v.health - (Math.random() < 0.55 ? 999 : Math.round(rnd(20, 80))));
    if (v.health === 0) {
      v.isAlive = false; v.deaths++; v.deathsThisRound++;
      s.kills++; s.killsThisRound++;
      const helper = alive(st).find((p) => p !== s);
      if (helper && Math.random() < 0.4) helper.assists++;
      s.currUltPoints = Math.min(s.maxUltPoints, s.currUltPoints + 1); s.ultReady = s.currUltPoints >= s.maxUltPoints;
      if (v.isObserved) { v.isObserved = false; sim.nextObs = sim.t; }
    }
  }
  function step(dt) {
    const d = sim.d;
    sim.t += dt;
    const el = sim.t - sim.at;
    if (d.roundPhase === "shopping") {
      sim.plan.forEach((b) => { if (el >= b.at) buy(b); });
      if (el >= DURATION.shopping) startCombat();
    } else if (d.roundPhase === "combat") {
      const att = d.teams.find((t) => t.isAttacking), def = d.teams.find((t) => !t.isAttacking);
      const aA = att.players.some((p) => p.isAlive), dA = def.players.some((p) => p.isAlive);
      if (sim.t >= sim.nextObs) {
        const c = d.teams.flatMap((t) => t.players.filter((p) => p.isAlive));
        d.teams.forEach((t) => t.players.forEach((p) => (p.isObserved = false)));
        if (c.length) pick(c).isObserved = true;
        sim.nextObs = sim.t + rnd(6, 11);
      }
      if (sim.t >= sim.nextEvent) { fight(); sim.nextEvent = sim.t + rnd(3, 9); }
      if (!d.spikeState.planted && sim.t >= sim.plantAt && aA) plant();
      if (d.spikeState.planted) {
        if (sim.t - sim.plantAt >= DURATION.spike) { d.spikeState.detonated = true; endRound(true, "detonated"); }
        else if (!aA && dA && sim.t - sim.plantAt > 8) { d.spikeState.defused = true; endRound(false, "defused"); }
        else if (!dA) endRound(true, "kills");
      } else if (!aA) endRound(false, "kills");
      else if (!dA) endRound(true, "kills");
      else if (el >= DURATION.combat) endRound(false, "timeout");
    } else if (d.roundPhase === "end" && el >= 9) nextRound();
  }
  // começa no meio da partida, para a prévia já mostrar histórico e economia
  startShopping();
  sim.speed = 1;
  for (let i = 0; i < 1800 && sim.d.roundNumber < 10; i++) step(0.5);
  sim.speed = 3;

  let last = performance.now();
  function frame(ts) {
    const dt = Math.min(0.25, (ts - last) / 1000); last = ts;
    if (!sim.paused) step(dt * sim.speed);
    render(sim.d, sim.t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (MODE === "preview") {
    const note = $("img-note");
    const updNote = () => setText(note, LOCAL.base
      ? "Imagens carregadas da pasta de recursos (" + LOCAL.base + ")."
      : ASSETS.ready ? "Imagens oficiais do jogo carregadas da internet."
      : "Esta prévia mostra ícones próprios no lugar das imagens do jogo, porque a página publicada não pode carregar imagens de outros sites. Aberto no navegador ou no OBS, com a pasta Resources ao lado, aparecem retratos, habilidades, armas e logos.");
    updNote(); setTimeout(updNote, 4000);
    const pb = $("btn-play"), sb = $("btn-speed");
    pb.addEventListener("click", () => { sim.paused = !sim.paused; pb.textContent = sim.paused ? "Continuar" : "Pausar"; pb.setAttribute("aria-pressed", String(sim.paused)); });
    sb.addEventListener("click", () => { sim.speed = sim.speed === 3 ? 1 : 3; sb.textContent = sim.speed === 3 ? "Velocidade 3×" : "Velocidade 1×"; sb.setAttribute("aria-pressed", String(sim.speed === 1)); });
    document.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
      const j = b.dataset.jump, d = sim.d;
      if (j === "shopping") { if (d.roundPhase !== "shopping") nextRound(); }
      else if (j === "combat") { if (d.roundPhase === "end") nextRound(); if (sim.d.roundPhase === "shopping") startCombat(); }
      else if (j === "plant") { if (d.roundPhase === "end") nextRound(); if (sim.d.roundPhase === "shopping") startCombat(); plant(); }
      else if (j === "end") {
        if (d.roundPhase === "end") nextRound();
        if (sim.d.roundPhase === "shopping") startCombat();
        const attWins = sim.d.spikeState.planted ? true : Math.random() < 0.5;
        const winners = sim.d.teams.find((t) => t.isAttacking === attWins);
        const star = pick(winners.players.filter((p) => p.isAlive).length ? winners.players.filter((p) => p.isAlive) : winners.players);
        sim.d.teams.filter((t) => t.isAttacking !== attWins).forEach((t) => t.players.forEach((p) => { if (p.isAlive) { p.isAlive = false; p.health = 0; p.deaths++; star.kills++; star.killsThisRound++; } }));
        endRound(attWins, "kills");
      }
    }));
    const cl = $("c-left"), cr = $("c-right");
    cl.value = CORES.esquerda; cr.value = CORES.direita;
    cl.addEventListener("input", () => { CORES.esquerda = cl.value; applyColors(); });
    cr.addEventListener("input", () => { CORES.direita = cr.value; applyColors(); });
  }
})();
</script>
</body>
</html>
